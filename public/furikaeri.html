<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f8f8f8">
<title>部門対抗 スズリーグ 回答ページ</title>
<!--
  部門対抗モード（振り返り会 2026-12-03）の回答ページ。各部門の入力係が自分のスマホで開き、
  部門の4桁の合言葉を入れて%を回答する。合言葉で部門が決まる。
  Render（cloud-server の public/furikaeri.html）から配信する。元ファイルは src/suzuleague/furikaeri.html。
  書き出しは uv run python -m suzuleague.publish。設計は docs/furikaeri/design.md の「回答ページ」。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@700;900&display=swap">
<style>
  /* 見た目は高専祭の公式HP（テーマ「collage」）のデザインシステムに合わせる。
     白い紙に、テープで留めたハードシャドウのカードを貼る。色は HP の global.css と同じ値。
     HP にならい、暗い配色（ダークモード）は用意しない */
  :root {
    --blue: #1a33d6; --red: #e31b23; --yellow: #f4d21f; --ink: #111111; --paper: #f8f8f8;
    --muted: #555555; --line: #111111;
    --font-body: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, -apple-system, sans-serif;
    --font-num: "Bebas Neue", "Impact", "Arial Black", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  html, body { margin: 0; }
  body {
    position: relative;
    background: var(--paper); color: var(--ink);
    font-family: var(--font-body); font-weight: 700;
    font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%;
    padding: 0 16px calc(28px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; min-height: 100vh;
  }
  /* 紙の質感（HP の body::after と同じノイズ） */
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 50;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.9" numOctaves="4" seed="11"/><feColorMatrix type="saturate" values="0"/></filter><rect width="240" height="240" filter="url(%23n)"/></svg>');
    background-size: 240px 240px; opacity: .1; mix-blend-mode: multiply;
  }
  /* 右上の貼り紙（飾り）。はみ出しで横スクロールが出ないよう、入れ物で切り取る */
  .deco-clip { position: absolute; top: 0; left: 0; right: 0; height: 160px; overflow: hidden; z-index: 0; pointer-events: none; }
  .deco {
    position: absolute; top: -18px; right: -26px; width: 120px; height: 70px; z-index: 0; pointer-events: none;
    background: repeating-conic-gradient(var(--blue) 0 25%, #fff 0 50%) 0 0 / 16px 16px;
    transform: rotate(8deg); filter: url(#torn-edge);
  }
  .deco-star { position: absolute; top: 46px; right: 10px; z-index: 0; font-family: var(--font-num); font-size: 26px; line-height: 1; color: var(--red); transform: rotate(14deg); pointer-events: none; }
  header, #pick, #game { position: relative; z-index: 1; }

  /* テープ（文字にはフィルタを掛けず、::before の地にだけ掛ける） */
  .tape { position: relative; z-index: 0; display: inline-block; font-weight: 900; }
  .tape::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--tape-bg, var(--ink)); filter: url(#tape-edge); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 18px 0 6px; }
  header h1 { font-size: 15px; margin: 0; color: #fff; padding: 5px 16px; letter-spacing: .06em; transform: rotate(-1.6deg); }
  header h1 b { color: var(--yellow); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; flex: none;
    padding: 3px 10px; background: #fff; border: 2px solid var(--ink); transform: rotate(1deg);
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
  .pill[data-kind="ok"] .dot { background: var(--blue); }
  .pill[data-kind="ng"] .dot { background: var(--red); }

  /* カード：白地・黒枠・ハードシャドウ。上にテープを1枚貼る */
  .card {
    position: relative; background: #fff; border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
    padding: 18px 16px 14px; margin: 22px 0 14px; transform: rotate(var(--tilt, -.5deg));
  }
  .card::before {
    content: ""; position: absolute; top: -11px; left: 18px; width: 72px; height: 20px;
    background: var(--tape, var(--yellow)); transform: rotate(-4deg); filter: url(#tape-edge);
  }
  .card.t-red { --tape: var(--red); --tilt: .5deg; }
  .card.t-blue { --tape: var(--blue); --tilt: -.3deg; }
  .card.flat { --tilt: 0deg; }
  .label { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .team-name { font-size: 22px; font-weight: 900; line-height: 1.3; overflow-wrap: anywhere; }
  .balloons { text-align: right; white-space: nowrap; }
  .balloons b { font-family: var(--font-num); font-weight: 400; font-size: 46px; line-height: 1; color: var(--red); }
  .question { font-size: 19px; font-weight: 900; margin: 8px 0 0; overflow-wrap: anywhere; }
  .big { font-size: 24px; font-weight: 900; margin: 2px 0 4px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
  .readout { text-align: center; font-family: var(--font-num); font-size: 92px; line-height: 1; margin: 10px 0 2px; }
  .readout small { font-size: 42px; margin-left: 4px; }
  .readout.empty { color: #b5b5b5; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .keys button {
    min-height: 60px; font-family: var(--font-num); font-size: 34px; line-height: 1; padding-top: 4px;
    border: 2px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink);
    box-shadow: 3px 3px 0 var(--ink); touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .keys button:active { transform: translate(3px, 3px); box-shadow: none; }
  .keys button.sub { font-family: var(--font-body); font-weight: 900; font-size: 15px; padding-top: 0; background: var(--paper); }
  .send {
    width: 100%; min-height: 64px; margin-top: 16px; border: 2px solid var(--ink); border-radius: 0;
    background: var(--red); color: #fff; font-family: var(--font-body); font-size: 20px; font-weight: 900;
    box-shadow: 4px 4px 0 var(--ink); touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .send:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: none; }
  .send:disabled { background: #c9c9c9; color: #fff; border-color: #9a9a9a; box-shadow: 4px 4px 0 #9a9a9a; }
  .status { text-align: center; margin-top: 12px; min-height: 24px; font-weight: 900; }
  .status[data-kind="ok"] { color: var(--blue); }
  .status[data-kind="ng"] { color: var(--red); }
  .result { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-top: 10px; }
  .result div { border: 2px solid var(--ink); background: var(--paper); padding: 8px 4px 4px; }
  .result b { display: block; font-family: var(--font-num); font-weight: 400; font-size: 36px; line-height: 1.1; }
  .result div:nth-child(2) { background: var(--yellow); }
  .result div:nth-child(2) .label { color: var(--ink); }
  .result div:nth-child(3) b { color: var(--red); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  td { padding: 8px 4px; border-top: 1.5px dashed var(--ink); }
  tr:first-child td { border-top: 0; }
  td.num { text-align: right; white-space: nowrap; font-family: var(--font-num); font-size: 22px; line-height: 1; font-weight: 400; }
  td.num:first-child { text-align: left; font-family: var(--font-body); font-size: 15px; font-weight: 900; }
  tr.me td { background: var(--yellow); font-weight: 900; }
  /* 2列に固定し、最長の「ステージイベント」（8文字）が 320幅でも1行に入るよう文字を画面幅に合わせて縮める。
     縮めても入らない書体のときは、はみ出さずに折り返す */
  .teams-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .teams-pick button {
    min-width: 0; min-height: 58px; border: 2px solid var(--ink); border-left: 8px solid var(--c, var(--red)); border-radius: 0;
    background: #fff; color: var(--ink); font-family: var(--font-body); font-size: clamp(12px, 3.8vw, 16px); font-weight: 900;
    line-height: 1.25; padding: 4px; box-shadow: 3px 3px 0 var(--ink); touch-action: manipulation;
    overflow-wrap: anywhere; -webkit-tap-highlight-color: transparent;
  }
  .teams-pick button:nth-child(4n+2) { --c: var(--blue); }
  .teams-pick button:nth-child(4n+3) { --c: var(--yellow); }
  .teams-pick button:nth-child(4n+4) { --c: var(--ink); }
  .teams-pick button:active { transform: translate(3px, 3px); box-shadow: none; }
  .link {
    width: 100%; border: 0; background: none; color: var(--ink); font-family: var(--font-body); font-size: 14px; font-weight: 700;
    min-height: 44px; margin-top: 6px; text-decoration: underline; text-underline-offset: 3px;
  }
</style>
</head>
<body>
<!-- テープのちぎれと紙の破れ（HP の SvgDefs.astro と同じフィルタ） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="tape-edge" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.28" numOctaves="3" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" />
    </filter>
    <filter id="torn-edge" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="4" seed="3" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" />
    </filter>
  </defs>
</svg>
<div class="deco-clip" aria-hidden="true"><div class="deco"></div><div class="deco-star">★</div></div>
<header>
  <h1 class="tape">部門対抗 <b>スズリーグ</b></h1>
  <span id="conn" class="pill"><span class="dot"></span><span id="conn-text">接続中…</span></span>
</header>

<div id="pick" class="card hidden">
  <div class="big">あなたの部門は？</div>
  <div class="muted" id="pick-note">自分の部門のボタンを押してください。押し間違えたら、あとで選び直せます。</div>
  <div class="teams-pick" id="pick-buttons"></div>
</div>

<div id="game" class="hidden">
  <div class="card row t-red">
    <div><div class="label">あなたの部門</div><div id="team-name" class="team-name"></div></div>
    <div class="balloons"><div class="label">残りバルーン</div><b id="balloons">100</b></div>
  </div>

  <div id="msg" class="card t-blue">
    <div id="m-title" class="big"></div>
    <div id="m-body" class="muted"></div>
    <div id="m-question" class="question hidden"></div>
  </div>

  <div id="answer-card" class="card flat hidden">
    <div class="label" id="a-round"></div>
    <div id="a-question" class="question"></div>
    <div id="readout" class="readout empty">--<small>%</small></div>
    <div class="keys" id="keys">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="C" class="sub">消す</button><button data-k="0">0</button><button data-k="B" class="sub">1字戻す</button>
    </div>
    <button id="send" class="send" disabled>この数字で回答する</button>
    <div id="a-status" class="status"></div>
  </div>

  <div id="result-card" class="card t-red hidden">
    <div class="label" id="r-title"></div>
    <div class="result">
      <div><span class="label">予想</span><b id="r-answer">-</b></div>
      <div><span class="label">正解</span><b id="r-correct">-</b></div>
      <div><span class="label">割れた</span><b id="r-damage">-</b></div>
    </div>
  </div>

  <div id="rank-card" class="card t-blue hidden">
    <div class="label">順位</div>
    <table><tbody id="rank-rows"></tbody></table>
  </div>

  <button id="change-team" class="link">部門を選び直す</button>
</div>

<script>
(function () {
  "use strict";

  var POLL_MS = 1000;
  var STALE_SEC = 8;
  var TEAM_KEY = "suzuleague-furikaeri-team";
  var STATE = { IDLE: 0, QUESTION: 2, ANSWERING: 3, REVEAL: 4, ROUND_RESULT: 5, FINISHED: 8, OPEN: 9 };

  var el = function (id) { return document.getElementById(id); };
  var teamNo = null;        // 選んだ部門の番号（端末に覚えておく）
  var current = null;
  var typed = "";           // テンキーで入れている数字
  var typedFor = null;      // どの問題のために入れているか（問題が変わったら消す）
  var sent = null;          // この問題に送った数字 {qid, value}
  var sending = false;

  try { teamNo = Number(localStorage.getItem(TEAM_KEY)) || null; } catch (e) { /* 保存できない環境 */ }

  function setConn(kind, text) { el("conn").setAttribute("data-kind", kind); el("conn-text").textContent = text; }
  function show(id, visible) { el(id).classList.toggle("hidden", !visible); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function postJson(path, body) {
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.error || ("送れませんでした（HTTP " + res.status + "）"));
          return data;
        });
      });
  }

  // ---- 部門を選ぶ ------------------------------------------------------

  function pickTeam(n) {
    teamNo = n; sent = null;
    try { localStorage.setItem(TEAM_KEY, String(n)); } catch (e) { /* 保存できない環境 */ }
    render(current);
  }

  el("pick-buttons").addEventListener("click", function (ev) {
    var b = ev.target.closest && ev.target.closest("button[data-team]");
    if (b) pickTeam(Number(b.getAttribute("data-team")));
  });

  el("change-team").addEventListener("click", function () {
    teamNo = null; sent = null;
    try { localStorage.removeItem(TEAM_KEY); } catch (e) { /* 保存できない環境 */ }
    render(current);
  });

  function drawPick(s) {
    var teams = s && s.mode === "battle" ? s.teams : [];
    el("pick-note").textContent = teams.length
      ? "自分の部門のボタンを押してください。押し間違えたら、あとで選び直せます。"
      : "準備中です。進行のPCがつながると部門のボタンが出ます。";
    var html = teams.map(function (t) {
      return '<button type="button" data-team="' + t.number + '">' + esc(t.name) + "</button>";
    }).join("");
    if (el("pick-buttons").dataset.html !== html) { el("pick-buttons").innerHTML = html; el("pick-buttons").dataset.html = html; }
  }

  // ---- テンキー --------------------------------------------------------

  el("keys").addEventListener("click", function (ev) {
    var k = ev.target && ev.target.getAttribute("data-k");
    if (!k) return;
    if (k === "C") typed = "";
    else if (k === "B") typed = typed.slice(0, -1);
    else if (typed.length < 3) {
      var next = typed === "0" ? k : typed + k;
      if (Number(next) <= 100) typed = next;
    }
    drawReadout();
  });

  function drawReadout() {
    var r = el("readout");
    r.classList.toggle("empty", typed === "");
    r.innerHTML = (typed === "" ? "--" : typed) + "<small>%</small>";
    var s = current;
    el("send").disabled = typed === "" || sending || !s || s.state !== STATE.ANSWERING;
  }

  // 回答欄の下の一言（kind: "" ふつう／"ok" 届いた／"ng" 失敗）
  function setStatus(kind, text) { var a = el("a-status"); a.dataset.kind = kind; a.textContent = text; }

  el("send").addEventListener("click", function () {
    var s = current;
    if (!s || !s.question || typed === "") return;
    var value = Number(typed), qid = s.question.id;
    sending = true; drawReadout();
    setStatus("", "送っています…");
    postJson("api/player/answer", { team: teamNo, value: value, question_id: qid })
      .then(function () {
        // サーバは預かった時点で返事をする。進行のPCが受け付けたかは、次の状態で確かめる
        sent = { qid: qid, value: value, at: Date.now() };
        setStatus("", value + "% を送りました。届いたか確かめています…");
      })
      .catch(function (e) {
        // 電波が切れたときの fetch の失敗は英語の文（Failed to fetch など）なので、日本語に置き換える
        setStatus("ng", e instanceof TypeError
          ? "送れませんでした。電波を確かめて、もう一度「この数字で回答する」を押してください"
          : e.message);
      })
      .then(function () { sending = false; drawReadout(); });
  });

  // ---- 状態 ------------------------------------------------------------

  function poll() {
    fetch("api/player/state", { cache: "no-store" })
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function (data) {
        if (!data.state) setConn("ng", "準備中");
        else if (data.age > STALE_SEC) setConn("ng", "進行が止まっています");
        else setConn("ok", "接続中");
        render(data.state);
      })
      .catch(function () { setConn("ng", "つながりません"); });
  }

  function message(title, body, questionText) {
    el("m-title").textContent = title;
    el("m-body").textContent = body || "";
    el("m-question").textContent = questionText || "";
    show("m-question", !!questionText);
  }

  function render(s) {
    current = s;
    var needTeam = !teamNo;
    show("pick", needTeam);
    show("game", !needTeam);
    if (needTeam) { drawPick(s); return; }
    var mine = s && s.teams ? s.teams.filter(function (t) { return t.number === teamNo; })[0] : null;
    el("team-name").textContent = mine ? mine.name : "部門" + teamNo;
    // 正解発表のあいだは、大画面の演出（Scratch のゲージ→バルーン数の数え下げ。約21秒）より先に答えが分からないよう、
    // 減る前の数のままにする（減った数と正解は途中順位で出す）
    var hiding = !!(s && mine && s.state === STATE.REVEAL);
    el("balloons").textContent = mine ? mine.balloons + (hiding && mine.damage ? mine.damage : 0) : "-";

    show("answer-card", false); show("result-card", false); show("rank-card", false); show("msg", true);
    if (!s) { message("準備中", "進行を管理するPCを待っています。"); return; }
    if (s.mode !== "battle") { message("いまは部門対抗モードではありません", "司会の案内を待ってください。"); return; }
    if (!mine) { message("この部門は不参加になっています", "参加するときは司会に伝えてください。"); return; }

    var q = s.question ? s.question.text : "";
    var qid = s.question ? s.question.id : null;
    if (typedFor !== qid) { typed = ""; typedFor = qid; setStatus("", ""); }
    if (sent && sent.qid !== qid) sent = null;

    if (s.state === STATE.IDLE) {
      message("まもなく始まります", "全" + s.rounds + "問。問題が出たら、部門で相談して%を入れてください。");
    } else if (s.state === STATE.QUESTION) {
      message("第" + s.round + "問", "問題をよく聞いてください。もうすぐ回答できます。", q);
    } else if (s.state === STATE.ANSWERING) {
      show("msg", false); show("answer-card", true);
      el("a-round").textContent = "第" + s.round + "問 / " + s.rounds + (mine.eliminated ? "（脱落中。答えてもバルーンは減りません）" : "");
      el("a-question").textContent = q;
      if (sent && !sending) {
        if (mine.answered && Date.now() - sent.at > 1500) {
          setStatus("ok", sent.value + "% で回答しました（締め切りまでは直せます）");
        } else if (Date.now() - sent.at > 8000) {
          setStatus("ng", "回答が届いていないかもしれません。もう一度送るか、司会に伝えてください");
        }
      }
      drawReadout();
    } else if (s.state === STATE.OPEN) {
      var body = mine.answer == null ? "この問題は未回答でした（予想50とみなします）" : "あなたの部門の予想は " + mine.answer + "%。大画面を見てください。";
      if (sent && sent.qid === qid && mine.answer !== sent.value) {
        body += "（最後に送った " + sent.value + "% は締め切りに間に合いませんでした）";
      }
      message("予想オープン", body, q);
    } else if (s.state === STATE.REVEAL) {
      message("正解発表", "大画面を見てください。結果は途中順位でここにも出ます。", q);
    } else if (s.state === STATE.ROUND_RESULT || s.state === STATE.FINISHED) {
      show("msg", s.state === STATE.FINISHED);
      if (s.state === STATE.FINISHED) {
        var won = s.winners.some(function (w) { return w.number === teamNo; });
        message(won ? "優勝" : "最終結果", "あなたの部門は " + mine.rank + " 位でした。");
      }
      if (mine.error != null) {
        show("result-card", true);
        el("r-title").textContent = "第" + s.round + "問の結果";
        el("r-answer").textContent = mine.answer == null ? "―" : mine.answer + "%";
        el("r-correct").textContent = s.correct + "%";
        el("r-damage").textContent = mine.damage;
      }
      show("rank-card", true);
      var teams = s.teams.slice().sort(function (a, b) { return (a.rank - b.rank) || (a.number - b.number); });
      el("rank-rows").innerHTML = teams.map(function (t) {
        return '<tr class="' + (t.number === teamNo ? "me" : "") + '"><td class="num">' + t.rank + "位</td><td>" +
          esc(t.name) + (t.eliminated ? "（脱落）" : "") + '</td><td class="num">' + t.balloons + "</td></tr>";
      }).join("");
    }
  }

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
