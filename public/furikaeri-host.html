<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f8f8f8">
<title>スズリーグ 司会者画面（部門対抗）</title>
<!--
  部門対抗モード（振り返り会 2026-12-03）の司会者画面。司会のスマホで進行を操作する。
  host.html（高専祭本番の司会者画面）は、部門対抗モードの状態が届くとこのページに切り替わる。
  合言葉（HOST_TOKEN）は host.html と同じ保存場所を使う。
  元ファイルは src/suzuleague/furikaeri-host.html。設計は docs/furikaeri/design.md の「司会者画面」。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@700;900&display=swap">
<style>
  /* 見た目は高専祭の公式HP（テーマ「collage」）のデザインシステムに合わせる（回答ページ・大画面と同じ）。
     操作する画面なので、カードはほとんど傾けない。HP にならい、暗い配色（ダークモード）は用意しない */
  :root {
    --blue: #1a33d6; --red: #e31b23; --yellow: #f4d21f; --ink: #111111; --paper: #f8f8f8;
    --muted: #555555; --line: #111111; --ok: var(--blue); --ng: var(--red);
    --font-body: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, -apple-system, sans-serif;
    --font-num: "Bebas Neue", "Impact", "Arial Black", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  html, body { margin: 0; }
  body {
    position: relative;
    background: var(--paper); color: var(--ink);
    font-family: var(--font-body); font-weight: 700;
    font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%;
    padding: 0 14px calc(28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; min-height: 100vh;
  }
  /* 紙の質感（HP の body::after と同じノイズ） */
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 50;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.9" numOctaves="4" seed="11"/><feColorMatrix type="saturate" values="0"/></filter><rect width="240" height="240" filter="url(%23n)"/></svg>');
    background-size: 240px 240px; opacity: .1; mix-blend-mode: multiply;
  }
  /* 右上の貼り紙（飾り）。はみ出しで横スクロールが出ないよう、入れ物で切り取る */
  .deco-clip { position: absolute; top: 0; left: 0; right: 0; height: 150px; overflow: hidden; z-index: 0; pointer-events: none; }
  .deco {
    position: absolute; top: -20px; right: -30px; width: 120px; height: 66px;
    background: #fff radial-gradient(circle, var(--red) 32%, transparent 35%) 0 0 / 11px 11px;
    transform: rotate(-7deg); filter: url(#torn-edge);
  }
  body > *:not(.deco-clip):not(svg):not(.overlay) { position: relative; z-index: 1; }

  .tape { position: relative; z-index: 0; display: inline-block; font-weight: 900; }
  .tape::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--tape-bg, var(--ink)); filter: url(#tape-edge); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 18px 0 6px; }
  header h1 { white-space: nowrap; font-size: 14px; margin: 0; color: #fff; padding: 5px 14px; letter-spacing: .04em; transform: rotate(-1.4deg); }
  header h1 b { color: var(--yellow); }
  #rehearsal { color: var(--yellow); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; flex: none;
    padding: 3px 10px; background: #fff; border: 2px solid var(--ink); transform: rotate(1deg);
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
  .pill[data-kind="ok"] .dot { background: var(--blue); }
  .pill[data-kind="ng"] .dot { background: var(--red); }
  .pill[data-kind="ng"] { color: var(--red); border-color: var(--red); }

  .card {
    background: #fff; border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
    padding: 16px 14px 12px; margin: 22px 0 14px;
  }
  .card::before {
    content: ""; position: absolute; top: -11px; left: 16px; width: 70px; height: 20px;
    background: var(--tape, var(--yellow)); transform: rotate(-4deg); filter: url(#tape-edge);
  }
  .card.t-blue { --tape: var(--blue); }
  .card.t-red { --tape: var(--red); }
  .card.main { transform: rotate(-.4deg); }
  .label { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  .state { font-size: 24px; font-weight: 900; line-height: 1.35; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .question { font-size: 17px; font-weight: 900; margin-top: 6px; }
  .correct-btn {
    margin-top: 10px; width: 100%; min-height: 46px; border: 2px dashed var(--ink); border-radius: 0;
    background: var(--paper); color: var(--muted); font-family: var(--font-body); font-size: 15px; font-weight: 900;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .correct-btn.on { background: var(--yellow); color: var(--ink); border-style: solid; font-size: 24px; }
  .next {
    width: 100%; min-height: 74px; border: 2px solid var(--ink); border-radius: 0; background: var(--blue);
    color: #fff; font-family: var(--font-body); font-size: 21px; font-weight: 900; margin-top: 4px;
    box-shadow: 5px 5px 0 var(--ink); touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .next:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: none; }
  .next:disabled { background: #c9c9c9; border-color: #9a9a9a; box-shadow: 5px 5px 0 #9a9a9a; }
  .sub-btn {
    width: 100%; min-height: 50px; border: 2px solid var(--ink); border-radius: 0;
    background: var(--yellow); color: var(--ink); font-family: var(--font-body); font-size: 16px; font-weight: 900;
    margin-top: 14px; box-shadow: 3px 3px 0 var(--ink); touch-action: manipulation;
  }
  .sub-btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .toast { min-height: 22px; margin: 10px 2px 0; font-size: 14px; font-weight: 900; }
  .toast[data-kind="ok"] { color: var(--ok); }
  .toast[data-kind="ng"] { color: var(--ng); }
  .missing { color: var(--red); font-weight: 900; font-size: 14px; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  td { padding: 8px 3px; border-top: 1.5px dashed var(--ink); vertical-align: middle; }
  tr:first-child td { border-top: 0; }
  td.num { text-align: right; white-space: nowrap; font-family: var(--font-num); font-weight: 400; font-size: 21px; line-height: 1; }
  td.num:first-child { text-align: left; font-family: var(--font-body); font-weight: 900; font-size: 15px; }
  td.name { font-weight: 900; }
  tr.off td { color: #9a9a9a; text-decoration: line-through; }
  tr.out td.name { color: #9a9a9a; }
  .yes { color: var(--blue); }
  .no { font-family: var(--font-body); font-size: 14px; font-weight: 900; color: var(--red); }
  td .muted { font-family: var(--font-body); font-size: 14px; }
  .toggle {
    min-width: 76px; min-height: 38px; border: 2px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink);
    font-family: var(--font-body); font-size: 14px; font-weight: 900; box-shadow: 2px 2px 0 var(--ink); text-decoration: none;
  }
  .toggle.on { background: var(--blue); color: #fff; }
  .proxy { display: grid; grid-template-columns: 1fr 90px 90px; gap: 8px; margin-top: 10px; }
  .proxy select, .proxy input, .proxy button {
    min-height: 48px; border: 2px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink);
    font-family: var(--font-body); font-size: 17px; font-weight: 700; padding: 0 8px; width: 100%; min-width: 0;
  }
  .proxy button { background: var(--red); color: #fff; font-weight: 900; box-shadow: 3px 3px 0 var(--ink); }
  .proxy button:active { transform: translate(3px, 3px); box-shadow: none; }
  .overlay { position: fixed; inset: 0; z-index: 60; background: rgba(17,17,17,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .overlay form { background: #fff; border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 18px; width: 100%; max-width: 380px; }
  .overlay input { width: 100%; min-height: 50px; font-size: 20px; margin: 12px 0; border: 2px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink); padding: 0 10px; }
  .overlay button { width: 100%; min-height: 50px; border: 2px solid var(--ink); border-radius: 0; background: var(--blue); color: #fff; font-family: var(--font-body); font-size: 17px; font-weight: 900; box-shadow: 3px 3px 0 var(--ink); }
</style>
</head>
<body>
<!-- テープのちぎれと紙の破れ（HP の SvgDefs.astro と同じフィルタ） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="tape-edge" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.28" numOctaves="3" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" />
    </filter>
    <filter id="torn-edge" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="4" seed="3" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" />
    </filter>
  </defs>
</svg>
<div class="deco-clip" aria-hidden="true"><div class="deco"></div></div>
<header>
  <h1 class="tape"><b>スズリーグ</b> 司会者画面<span id="rehearsal" class="hidden"> リハーサル</span></h1>
  <span id="conn" class="pill"><span class="dot"></span><span id="conn-text">接続中…</span></span>
</header>

<div class="card main">
  <div class="label" id="round">開始前</div>
  <div class="state" id="state">—</div>
  <div id="q-wrap" class="hidden">
    <div id="question" class="question"></div>
    <button id="correct-btn" class="correct-btn" type="button">押しているあいだ正解を表示</button>
  </div>
  <div id="missing" class="missing hidden"></div>
</div>

<button id="next-btn" class="next" disabled>次へ</button>
<button id="close-btn" class="sub-btn hidden" type="button">未回答のまま締め切る</button>
<div id="toast" class="toast"></div>

<div class="card t-blue">
  <div class="label" id="teams-label">部門</div>
  <table><tbody id="teams"></tbody></table>
</div>

<div id="proxy-card" class="card t-red hidden">
  <div class="label">代理入力（部門から口頭で聞いた予想を入れる）</div>
  <div class="proxy">
    <select id="proxy-team"></select>
    <input id="proxy-value" type="number" inputmode="numeric" min="0" max="100" placeholder="%">
    <button id="proxy-btn" type="button">入力</button>
  </div>
</div>


<div id="token-overlay" class="overlay hidden">
  <form id="token-form">
    <div style="font-weight:800">司会者画面の合言葉</div>
    <input id="token-input" type="password" autocomplete="current-password">
    <button type="submit">開く</button>
  </form>
</div>

<script>
(function () {
  "use strict";

  var POLL_MS = 1000;
  var STALE_SEC = 6;
  var PENDING_TIMEOUT_MS = 8000;
  var TOKEN_KEY = "suzuleague-host-token";   // host.html と同じ
  var STATE = { IDLE: 0, QUESTION: 2, ANSWERING: 3, REVEAL: 4, ROUND_RESULT: 5, FINISHED: 8, OPEN: 9 };

  var el = function (id) { return document.getElementById(id); };
  var current = null, pending = null, stale = false, lastShownSeq = null, token = "";
  try { token = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { /* 保存できない環境 */ }

  function headers(json) {
    var h = {};
    if (token) h["X-Host-Token"] = token;
    if (json) h["Content-Type"] = "application/json";
    return h;
  }
  function setConn(kind, text) { el("conn").setAttribute("data-kind", kind); el("conn-text").textContent = text; }
  function toast(kind, text) { var t = el("toast"); t.setAttribute("data-kind", kind || ""); t.textContent = text || ""; }
  function show(id, v) { el(id).classList.toggle("hidden", !v); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  el("token-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    token = el("token-input").value.trim();
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) { /* 保存できない環境 */ }
    show("token-overlay", false); toast("", ""); poll();
  });

  function poll() {
    fetch("api/host/state", { headers: headers(false), cache: "no-store" })
      .then(function (res) {
        if (res.status === 401) { show("token-overlay", true); toast("ng", token ? "合言葉が違います" : ""); throw null; }
        if (res.status === 503) { setConn("ng", "サーバの設定が未完了"); throw null; }
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data.state) { setConn("ng", "PCがまだつながっていません"); render(null); return; }
        if (data.state.mode !== "battle") { location.replace("host.html"); return; }
        stale = data.age > STALE_SEC;
        if (stale) setConn("ng", "PCの応答なし（" + Math.round(data.age) + "秒）");
        else setConn("ok", "PCと接続中");
        render(data.state);
      })
      .catch(function (err) { if (err) setConn("ng", "サーバにつながりません"); });
  }

  // ---- 描画 ------------------------------------------------------------

  function render(s) {
    current = s;
    if (!s) { el("state").textContent = "—"; updateButtons(); return; }
    show("rehearsal", s.rehearsal);
    el("round").textContent = s.round ? "第" + s.round + "問 / " + s.rounds : "開始前（全" + s.rounds + "問）";
    el("state").textContent = s.state_label;
    show("q-wrap", !!s.question);
    if (s.question) el("question").textContent = s.question.text;
    var miss = s.missing || [];
    show("missing", miss.length > 0);
    el("missing").textContent = "まだ答えていない：" + miss.join("、");
    show("close-btn", s.state === STATE.ANSWERING && miss.length > 0);
    show("proxy-card", s.state === STATE.ANSWERING);

    renderTeams(s);
    renderProxyOptions(s);
    if (s.last_command && s.last_command.seq !== lastShownSeq) {
      lastShownSeq = s.last_command.seq;
      toast(s.last_command.ok ? "ok" : "ng", s.last_command.message);
    }
    if (pending && s.last_command && s.last_command.seq >= pending.seq) pending = null;
    updateButtons();
  }

  function renderTeams(s) {
    var idle = s.state === STATE.IDLE;
    var answering = s.state === STATE.ANSWERING;
    el("teams-label").textContent = idle ? "参加する部門（来ていない部門は「不参加」に）" : (answering ? "回答状況" : "順位");
    var teams = s.teams.slice();
    if (!idle && !answering) {
      teams = teams.filter(function (t) { return t.active; });
      teams.sort(function (a, b) { return (a.rank - b.rank) || (a.number - b.number); });
    }
    el("teams").innerHTML = teams.map(function (t) {
      if (idle) {
        return '<tr class="' + (t.active ? "" : "off") + '"><td class="name">' + esc(t.name) + '</td><td class="num">' +
          '<button class="toggle ' + (t.active ? "on" : "") + '" data-team="' + t.number + '" data-active="' + (t.active ? 0 : 1) + '">' +
          (t.active ? "参加" : "不参加") + "</button></td></tr>";
      }
      if (!t.active) return "";
      var cls = t.eliminated ? "out" : "";
      if (answering) {
        var mark = t.answered ? '<span class="yes">' + t.answer + "%</span>" : (t.eliminated ? '<span class="muted">脱落</span>' : '<span class="no">まだ</span>');
        return '<tr class="' + cls + '"><td class="name">' + esc(t.name) + '</td><td class="num">' + mark + '</td><td class="num">' + t.balloons + "</td></tr>";
      }
      var extra = (t.answer !== null && t.answer !== undefined) ? t.answer + "%" : "";
      if (t.damage !== null && t.damage !== undefined) extra += "（−" + t.damage + "）";
      return '<tr class="' + cls + '"><td class="num">' + (t.rank || "") + '位</td><td class="name">' + esc(t.name) +
        (t.eliminated ? "（脱落）" : "") + '</td><td class="num muted">' + extra + '</td><td class="num">' + t.balloons + "</td></tr>";
    }).join("");
  }

  function renderProxyOptions(s) {
    var sel = el("proxy-team"), keep = sel.value;
    var opts = s.teams.filter(function (t) { return t.active; }).map(function (t) {
      return '<option value="' + t.number + '">' + esc(t.name) + "</option>";
    }).join("");
    if (sel.dataset.opts !== opts) { sel.innerHTML = opts; sel.dataset.opts = opts; if (keep) sel.value = keep; }
  }

  function updateButtons() {
    var s = current, btn = el("next-btn");
    if (pending && Date.now() - pending.at > PENDING_TIMEOUT_MS) pending = null;
    var label = s && s.next_action ? s.next_action : "（終わりました）";
    if (s && s.hold > 0) label = "演出中…（あと" + s.hold + "秒）";
    btn.textContent = pending ? "送信中…" : label;
    btn.disabled = !s || !s.next_action || !!pending || stale || s.hold > 0;
  }

  // ---- 操作 ------------------------------------------------------------

  function send(command) {
    command.client_id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    pending = { seq: Infinity, at: Date.now() };
    updateButtons();
    fetch("api/host/command", { method: "POST", headers: headers(true), body: JSON.stringify(command) })
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function (data) {
        pending = { seq: data.seq, at: Date.now() };
        if (data.result) { lastShownSeq = data.seq; toast(data.result.ok ? "ok" : "ng", data.result.message); pending = null; poll(); }
      })
      .catch(function (err) { pending = null; toast("ng", "送れませんでした（" + err.message + "）"); updateButtons(); });
  }

  el("next-btn").addEventListener("click", function () {
    if (!current) return;
    send({ type: "next", expect_state: current.state });
  });
  el("close-btn").addEventListener("click", function () {
    if (!current) return;
    var miss = (current.missing || []).join("、");
    if (!confirm(miss + " が未回答です。予想50として締め切りますか？")) return;
    send({ type: "close", expect_state: current.state });
  });
  el("teams").addEventListener("click", function (ev) {
    var b = ev.target.closest && ev.target.closest("button.toggle");
    if (!b) return;
    send({ type: "set_active", team: Number(b.dataset.team), active: b.dataset.active === "1" });
  });
  el("proxy-btn").addEventListener("click", function () {
    var v = el("proxy-value").value.trim();
    if (!/^\d{1,3}$/.test(v) || Number(v) > 100) { toast("ng", "0〜100の数字を入れてください"); return; }
    send({ type: "answer", team: Number(el("proxy-team").value), value: Number(v) });
    el("proxy-value").value = "";
  });

  var correctBtn = el("correct-btn");
  function correctOn(ev) {
    ev.preventDefault();
    if (current && current.question) { correctBtn.textContent = "正解 " + current.question.correct + "%"; correctBtn.classList.add("on"); }
  }
  function correctOff() { correctBtn.textContent = "押しているあいだ正解を表示"; correctBtn.classList.remove("on"); }
  correctBtn.addEventListener("pointerdown", correctOn);
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { correctBtn.addEventListener(t, correctOff); });
  correctBtn.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

  poll();
  setInterval(poll, POLL_MS);
  setInterval(updateButtons, 500);
})();
</script>
</body>
</html>
