<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>スズリーグ 部門対抗</title>
<!--
  部門対抗モード（振り返り会 2026-12-03）の大画面。プロジェクターに映す、入力のない画面。
  Render（cloud-server の public/board.html）から配信し、1秒ごとに公開用の状態（api/player/state）を読む。
  元ファイルは suzuleague リポジトリの src/suzuleague/board.html。書き出しは uv run python -m suzuleague.publish。
  設計は docs/furikaeri/design.md の「大画面ページ」。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@700;900&display=swap">
<style>
  /* 見た目は高専祭の公式HP（テーマ「collage」）のデザインシステムに合わせる。
     白い紙に、赤・青・黄・黒のテープとハードシャドウのカードを貼る。色は HP の global.css と同じ値 */
  :root {
    --blue: #1a33d6;
    --red: #e31b23;
    --yellow: #f4d21f;
    --ink: #111111;
    --paper: #f8f8f8;
    --grey: #8c8c8c;
    --font-body: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    --font-num: "Bebas Neue", "Impact", "Arial Black", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    display: flex; flex-direction: column;
    height: 100vh; width: 100vw;
    padding: 2.6vh 2.6vw 3vh;
    gap: 2.2vh;
  }
  /* 紙の質感（HP の body::after と同じノイズ） */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.9" numOctaves="4" seed="11"/><feColorMatrix type="saturate" values="0"/></filter><rect width="240" height="240" filter="url(%23n)"/></svg>');
    background-size: 240px 240px; opacity: .1; mix-blend-mode: multiply;
  }
  .num { font-family: var(--font-num); letter-spacing: .01em; }
  [hidden] { display: none !important; }

  /* ---- テープ（文字にはフィルタを掛けず、::before の地にだけ掛ける） ---- */
  .tape { position: relative; z-index: 0; display: inline-block; font-weight: 900; }
  .tape::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: var(--tape-bg, var(--ink)); filter: url(#tape-edge);
  }

  /* ---- 四隅の貼り紙（飾り。内容の後ろに敷く） ---- */
  .deco { position: fixed; pointer-events: none; z-index: 0; }
  .deco.dots {
    top: -5vh; left: -4vh; width: 26vh; height: 20vh; transform: rotate(-9deg);
    background: #fff radial-gradient(circle, var(--ink) 30%, transparent 33%) 0 0 / 2.2vh 2.2vh;
    filter: url(#torn-edge);
  }
  .deco.check {
    top: -3vh; right: -3vh; width: 22vh; height: 15vh; transform: rotate(7deg);
    background: repeating-conic-gradient(var(--blue) 0 25%, #fff 0 50%) 0 0 / 3vh 3vh;
    filter: url(#torn-edge);
  }
  .deco.stripe {
    bottom: -4vh; left: -5vh; width: 30vh; height: 11vh; transform: rotate(8deg);
    background: repeating-linear-gradient(45deg, var(--red) 0 1.1vh, #fff 1.1vh 2.2vh);
    filter: url(#torn-edge);
  }
  .deco.bluedots {
    bottom: -6vh; right: -4vh; width: 28vh; height: 18vh; transform: rotate(-6deg);
    background: #fff radial-gradient(circle, var(--blue) 32%, transparent 35%) 0 0 / 1.8vh 1.8vh;
    filter: url(#torn-edge);
  }
  .deco.star { font-family: var(--font-num); line-height: 1; }
  .deco.s1 { top: 14vh; right: 2vw; font-size: 6vh; color: var(--red); transform: rotate(14deg); }
  .deco.s2 { bottom: 4vh; left: 47vw; font-size: 4vh; color: var(--yellow); transform: rotate(-12deg); }
  .deco.s3 { top: 1.6vh; left: 44vw; font-size: 3.4vh; color: var(--blue); transform: rotate(8deg); }

  /* ---- 上部（タイトル・問題・正解） ---- */
  .top, .grid { position: relative; z-index: 1; }
  .top { display: flex; flex-direction: column; gap: 1.6vh; min-height: 28vh; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
  .brand {
    font-size: 3vh; letter-spacing: .08em; color: #fff;
    padding: .7vh 1.8vw; transform: rotate(-1.6deg); margin-left: 1vw;
  }
  .brand b { color: var(--yellow); }
  .round {
    --tape-bg: var(--red); color: #fff; font-size: 3.2vh; padding: .6vh 1.8vw; transform: rotate(1.4deg);
  }
  .tag {
    --tape-bg: var(--yellow); color: var(--ink); font-size: 2.2vh; letter-spacing: 0;
    padding: .3vh 1vw; margin-left: 1.2vw; transform: rotate(3deg); vertical-align: middle;
  }
  .main-line {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 3.4vw;
    text-align: center;
  }
  /* 問題文は、黄色いテープで留めた白いカードに載せる */
  .question {
    position: relative; max-width: 86vw;
    font-size: 5.2vh; font-weight: 900; line-height: 1.4; text-wrap: balance;
    word-break: auto-phrase;  /* 「未来」などの言葉の途中で改行しない（Chrome。ほかのブラウザでは無視される） */
    background: #fff; border: .3vh solid var(--ink); box-shadow: .9vh .9vh 0 var(--ink);
    padding: 2.4vh 2.8vw 2.2vh; transform: rotate(-.6deg);
  }
  .question::before {
    content: ""; position: absolute; top: -1.6vh; left: 3vw; width: 14vh; height: 3.2vh;
    background: var(--yellow); transform: rotate(-4deg); filter: url(#tape-edge);
  }
  .question.small { font-size: 3.4vh; max-width: 52vw; text-align: left; }
  .correct {
    display: flex; align-items: center; gap: 1.6vw; white-space: nowrap;
    animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  .correct span { color: #fff; font-size: 4.2vh; padding: .6vh 1.4vw; transform: rotate(-3deg); }
  .correct b {
    --tape-bg: var(--yellow); font-family: var(--font-num); font-weight: 400;
    font-size: 19vh; line-height: .95; padding: 1.6vh 2.4vw 0; transform: rotate(2deg);
  }
  .correct b small { font-size: 9vh; }
  .headline { color: #fff; font-size: 6.6vh; letter-spacing: .04em; padding: 1.2vh 2.6vw; transform: rotate(-1.2deg); }
  .headline.win {
    --tape-bg: var(--red); font-size: 8.6vh; padding: 1.4vh 3vw; white-space: nowrap;
    animation: pop .6s cubic-bezier(.2,1.6,.4,1);
  }
  .win-wrap { display: flex; align-items: center; gap: 2vw; }
  .win-wrap .star { font-family: var(--font-num); line-height: 1; font-size: 11vh; }
  .win-wrap .star.l { color: var(--yellow); transform: rotate(-14deg); }
  .win-wrap .star.r { color: var(--blue); transform: rotate(12deg); }

  /* 待機中：ルールのカードと QR */
  .rules {
    position: relative; text-align: left; font-size: 3.2vh; font-weight: 700; line-height: 1.85;
    background: #fff; border: .3vh solid var(--ink); box-shadow: .9vh .9vh 0 var(--ink);
    padding: 2.6vh 2.6vw 2.2vh; transform: rotate(-.8deg);
  }
  .rules::before {
    content: ""; position: absolute; top: -1.5vh; right: 3vw; width: 13vh; height: 3vh;
    background: var(--blue); transform: rotate(5deg); filter: url(#tape-edge);
  }
  .rules b { font-weight: 900; background: linear-gradient(transparent 58%, var(--yellow) 58%); }
  .qr { display: flex; align-items: center; gap: 2vw; text-align: left; transform: rotate(1deg); }
  .qr .code { --tape-bg: var(--yellow); padding: 1.8vh; }
  .qr svg { display: block; width: 23vh; height: 23vh; background: #fff; padding: .6vh; }
  .qr div { font-size: 2.7vh; font-weight: 700; line-height: 1.7; }
  .qr div b { --tape-bg: var(--blue); color: #fff; font-size: 3vh; padding: .4vh 1.2vw; margin-bottom: 1.2vh; transform: rotate(-2deg); }
  .qr .teams { display: block; margin-top: 1.2vh; font-size: 3vh; font-weight: 900; }
  .qr .teams em { font-style: normal; color: var(--red); }
  .status-line { text-align: center; font-size: 3.2vh; font-weight: 700; }
  .status-line b { font-weight: 900; color: var(--red); }

  /* ---- 部門のカード（白地・黒枠・ハードシャドウ。少しずつ傾けて貼る） ---- */
  .grid { flex: 1; display: flex; flex-direction: column; gap: 3vh; justify-content: center; }
  .row { display: flex; gap: 1.6vw; justify-content: center; flex: 1; max-height: 31vh; }
  .card {
    position: relative; width: 17.4vw;
    background: #fff; border: .3vh solid var(--ink); box-shadow: .7vh .7vh 0 var(--ink);
    padding: 2.2vh 1vw 1.4vh; display: flex; flex-direction: column; gap: .8vh;
    transform: rotate(var(--tilt, 0deg));
    transition: transform .6s, opacity .4s, background .3s, box-shadow .3s;
  }
  .row .card:nth-child(4n+1) { --tilt: -.9deg; --tape-bg: var(--yellow); }
  .row .card:nth-child(4n+2) { --tilt: .7deg;  --tape-bg: var(--red); }
  .row .card:nth-child(4n+3) { --tilt: -.4deg; --tape-bg: var(--blue); }
  .row .card:nth-child(4n+4) { --tilt: 1deg;   --tape-bg: var(--yellow); }
  .row:nth-child(2) .card:nth-child(odd) { --tilt: .8deg; }
  .card::before {
    content: ""; position: absolute; top: -1.4vh; left: 50%; width: 10vh; height: 2.6vh; margin-left: -5vh;
    background: var(--tape-bg); transform: rotate(-3deg); filter: url(#tape-edge);
  }
  .card.answered { box-shadow: .7vh .7vh 0 var(--blue); border-color: var(--blue); }
  .card.out {
    background: repeating-linear-gradient(135deg, #f1f1f1 0 1vh, #e6e6e6 1vh 2vh);
    border-color: var(--grey); box-shadow: .7vh .7vh 0 var(--grey);
  }
  .card.out::before { background: #bdbdbd; }
  .card.out .name, .card.out .count, .card.out .count small { color: var(--grey); }
  .card.top1 { background: var(--yellow); }
  .card.top1::after {
    content: "★"; position: absolute; top: -3.4vh; right: -1.4vw; font-family: var(--font-num);
    font-size: 7vh; line-height: 1; color: var(--red); transform: rotate(16deg);
  }
  .head { display: flex; align-items: center; gap: .6vw; }
  .name {
    /* 横幅の狭い画面（4:3 など）でも最長の「ステージイベント」が1行に入るよう、幅でも上限を決める */
    flex: 1; min-width: 0; font-size: min(2.8vh, 1.75vw); font-weight: 900; line-height: 1.25; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .count-row { display: flex; align-items: flex-end; justify-content: space-between; gap: .6vw; }
  .side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: .8vh; padding-bottom: .4vh; }
  .rank { flex: none; font-size: 3.2vh; font-weight: 900; line-height: 1; }
  .card.top1 .rank { color: var(--red); }
  .count {
    font-family: var(--font-num); font-size: 9.6vh; line-height: .9; color: var(--red);
  }
  .count small { font-family: var(--font-body); font-size: 2.3vh; font-weight: 900; color: var(--ink); margin-left: .3vw; }
  .meter { height: 1.7vh; border: .25vh solid var(--ink); background: #fff; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--red); transition: width .25s linear; }
  .card.out .meter { border-color: var(--grey); }
  .card.out .meter i { background: var(--grey); }
  .slot {
    margin-top: auto; min-height: 6.8vh; border: .25vh dashed var(--ink); background: rgba(255,255,255,.7);
    display: flex; align-items: center; justify-content: center; gap: .8vw;
    font-size: 2.6vh; font-weight: 700; color: #555;
  }
  .card.out .slot { border-color: var(--grey); }
  .slot.done { background: var(--blue); border: .25vh solid var(--blue); color: #fff; font-weight: 900; }
  .slot .guess { font-family: var(--font-num); font-size: 6.4vh; line-height: 1; color: var(--ink); padding-top: .6vh; }
  .slot .guess small { font-size: 3.2vh; }
  .slot .dmg {
    --tape-bg: var(--red); font-family: var(--font-num); font-weight: 400; font-size: 4.4vh; line-height: 1;
    color: #fff; padding: .7vh .7vw .2vh; transform: rotate(-4deg);
  }
  .slot .dmg.zero {
    --tape-bg: var(--yellow); font-family: var(--font-body); font-weight: 900; color: var(--ink);
    font-size: 2.6vh; padding: .6vh .7vw; white-space: nowrap;
  }
  .slot .note { font-size: 2.4vh; font-weight: 900; color: var(--ink); white-space: nowrap; }
  .slot .note b { font-family: var(--font-num); font-weight: 400; color: var(--red); font-size: 3.8vh; vertical-align: -.3vh; }
  .slot.flip { animation: flip .5s ease-out backwards; }
  .badge {
    --tape-bg: var(--ink); flex: none; color: #fff; font-size: 1.9vh; padding: .2vh .6vw; transform: rotate(-4deg);
  }

  /* ---- 正解発表の後半：カードの上で風船が割れる（絵と音は Scratch の素材） ---- */
  .pops { position: absolute; right: .6vw; top: 4.6vh; width: 8.4vw; height: 9.6vh; pointer-events: none; }
  .pop { position: absolute; width: 3.4vh; height: 5.2vh; animation: pop-in .35s cubic-bezier(.2,1.6,.4,1) backwards; }
  /* 絵は糸の長い1つの風船（44×327）。頭と糸の上だけを見せ、色は回して変える */
  .pop i { display: block; width: 100%; height: 100%; overflow: hidden; }
  .pop img { display: block; width: 3.4vh; height: auto; }
  .pop.gone i { animation: burst .28s ease-out forwards; }
  .pop.gone::after {
    content: "✸"; position: absolute; left: 50%; top: .6vh; margin-left: -2.4vh; width: 4.8vh; text-align: center;
    font-size: 4.8vh; line-height: 1; color: var(--yellow); -webkit-text-stroke: .25vh var(--red);
    animation: spark .28s ease-out forwards;
  }
  .dove {
    position: fixed; z-index: 30; top: 52vh; left: 100vw; width: 16vh; pointer-events: none;
    animation: fly 2.6s linear forwards;
  }
  @keyframes pop-in { from { transform: scale(0); } }
  @keyframes burst { to { transform: scale(1.6); opacity: 0; } }
  @keyframes spark { from { transform: scale(.4); } to { transform: scale(1.3); opacity: 0; } }
  @keyframes fly {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-30vw, -14vh); }
    50% { transform: translate(-60vw, 4vh); }
    75% { transform: translate(-90vw, -12vh); }
    100% { transform: translate(-125vw, 0); }
  }

  /* ---- 正解発表の前半：Scratch のステージ画面を重ねる（予想は隠し、正解だけを出す） ---- */
  .stage-wrap {
    position: fixed; inset: 0; z-index: 40; background: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.8vh;
    opacity: 0; visibility: hidden; transition: opacity .5s, visibility 0s .5s;
  }
  .stage-wrap.on { opacity: 1; visibility: visible; transition: opacity .5s; }
  .stage-head { display: flex; align-items: center; gap: 1.6vw; }
  .stage-head .round { font-size: 3.4vh; }
  .stage-head .ttl { color: #fff; font-size: 4.2vh; padding: .5vh 2vw; transform: rotate(-1.4deg); }
  .stage-box {
    position: relative; height: 84vh; width: 112vh; /* Scratch のステージは 4:3 */
    border: .4vh solid var(--ink); box-shadow: 1.2vh 1.2vh 0 var(--ink); background: #000;
  }
  .stage-box iframe { display: block; width: 100%; height: 100%; border: 0; }
  /* 隠した問題枠のところに、部門対抗の問題文を置く */
  .stage-q {
    position: absolute; left: 6%; right: 6%; top: 14%;
    background: #fff; border: .3vh solid var(--ink); box-shadow: .7vh .7vh 0 var(--ink);
    font-size: 3.3vh; font-weight: 900; line-height: 1.35; text-align: center; text-wrap: balance; word-break: auto-phrase;
    padding: 1.4vh 1.6vw; transform: rotate(-.6deg);
  }
  .stage-q::before {
    content: ""; position: absolute; top: -1.4vh; left: 3vw; width: 12vh; height: 2.8vh;
    background: var(--yellow); transform: rotate(-4deg); filter: url(#tape-edge);
  }
  /* 予想の欄（ゲージの左上。消せない絵の一部）に重ねる札 */
  .stage-label {
    position: absolute; left: .8%; top: 68.6%; width: 32.6%; height: 16.8%;
    display: flex; align-items: center; justify-content: center;
    --tape-bg: var(--red); color: #fff; font-size: 4.8vh; transform: rotate(-2deg);
  }

  .sound {
    position: fixed; left: 1.2vw; bottom: 1vh; z-index: 45; border: 0; cursor: pointer;
    font-family: var(--font-body); font-size: 2vh; font-weight: 900; color: var(--ink);
    --tape-bg: var(--yellow); padding: .6vh 1vw;
  }

  .conn {
    position: fixed; right: 1vw; bottom: .8vh; z-index: 2; font-size: 1.6vh; font-weight: 700; color: #777; opacity: .7;
  }
  /* つながらないときは、隅の飾り（青い点）より手前に、白地で目立たせる（裏方が気づけるように） */
  .conn[data-kind="ng"] { z-index: 46; color: var(--red); opacity: 1; background: #fff; border: .25vh solid var(--red); padding: .3vh .8vw; font-size: 2vh; }
  .empty { margin: auto; font-size: 4vh; font-weight: 900; }

  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { opacity: 1; } }
  @keyframes flip { from { transform: rotateX(90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<!-- テープのちぎれと紙の破れ（HP の SvgDefs.astro と同じフィルタ） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="tape-edge" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.28" numOctaves="3" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" />
    </filter>
    <filter id="torn-edge" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="4" seed="3" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" />
    </filter>
  </defs>
</svg>
<div class="deco dots" aria-hidden="true"></div>
<div class="deco check" aria-hidden="true"></div>
<div class="deco stripe" aria-hidden="true"></div>
<div class="deco bluedots" aria-hidden="true"></div>
<div class="deco star s1" aria-hidden="true">★</div>
<div class="deco star s2" aria-hidden="true">★</div>
<div class="deco star s3" aria-hidden="true">★</div>
<section class="top">
  <div class="bar">
    <div class="brand tape"><b>スズリーグ</b> 部門対抗<span id="tag" class="tag tape" hidden>リハーサル</span></div>
    <div id="round" class="round tape" hidden></div>
  </div>
  <div id="main" class="main-line"></div>
  <div id="status" class="status-line"></div>
</section>
<section id="grid" class="grid"></section>
<div id="conn" class="conn">接続中…</div>
<!-- 正解発表の前半に重ねる Scratch のステージ画面（書き出した /stage/view/。ないときは出さない） -->
<div id="stage-wrap" class="stage-wrap" aria-hidden="true">
  <div class="stage-head"><span id="stage-round" class="round tape"></span><span class="ttl tape">正解発表</span></div>
  <div class="stage-box">
    <iframe id="stage-frame" title="Scratch のステージ画面" allow="autoplay" tabindex="-1"></iframe>
    <div id="stage-q" class="stage-q"></div>
    <div id="stage-label" class="stage-label tape">正解は…</div>
  </div>
</div>
<button id="sound" class="sound tape" type="button">🔈 クリックすると音が出ます</button>

<script>
(function () {
  "use strict";

  var POLL_MS = 1000;
  var STALE_SEC = 8;
  // 正解発表は2段に分ける（battle_host.BATTLE_REVEAL_HOLD はこの合計より少し長く）。
  //   前半: Scratch のステージ画面を重ね、ゲージが伸びて正解が出るまで（約14秒）を元の演出で見せる
  //   後半: 大画面に戻り、各部門のカードで減った数だけ風船が割れる（REVEAL_COUNT_MS）
  var REVEAL_COUNT_MS = 3000;     // 後半: バルーンを数え下げる長さ

        // 参加数は下の欄でなく QR の横に出す（10部門を2段に並べると、下の欄がカードの裏に隠れる）
        '<span class="teams">参加 <em>' + s.teams.length + "</em> 部門</span></div></div>";
    } else if (s.state === STATE.QUESTION) {
      main = '<div class="question">' + q + "</div>";
      status = "問題をよく聞いてください";
    } else if (s.state === STATE.ANSWERING) {
      main = '<div class="question">' + q + "</div>";
      var done = s.teams.filter(function (t) { return t.answered; }).length;
      status = "回答受付中　<b>" + done + " / " + s.teams.length + "</b> 部門が回答済み";
    } else if (s.state === STATE.OPEN || (s.state === STATE.REVEAL && stagePhase)) {
      // 正解発表の前半（Scratch の画面を重ねる前の待ちとフェードのあいだ）も、正解はまだ出さない
      main = '<div class="question">' + q + "</div>";
      status = "<b>予想オープン！</b>　正解は…？";
    } else if (s.state === STATE.REVEAL) {
      main = '<div class="question small">' + q + '</div><div class="correct"><span class="tape">正解</span><b class="tape">' +
        s.correct + "<small>%</small></b></div>";
    } else if (s.state === STATE.ROUND_RESULT) {
      main = '<div class="headline tape">第' + s.round + "問 終了　途中順位</div>";
      status = s.round < s.rounds ? "あと " + (s.rounds - s.round) + " 問" : "次は最終結果！";
    } else if (s.state === STATE.FINISHED) {
      // 同率優勝で名前が長くなっても1行に収める（折り返すと下の文字がカードの裏に隠れる）。
      // 4部門以上が並んだら名前は出さず、黄色い1位のカードで見せる
      var names = s.winners.length > 3 ? s.winners.length + "部門が同率"
        : s.winners.map(function (w) { return w.name; }).join("・");
      var chars = 4 + names.length;  // 「優勝　」と「！」の分を足す（エスケープする前の文字数で数える）
      main = s.winners.length
        ? '<div class="win-wrap"><span class="star l">★</span><div class="headline tape win" style="font-size:min(8.6vh,' +
          (64 / chars).toFixed(2) + 'vw)">優勝　' + esc(names) + '！</div><span class="star r">★</span></div>'
        : '<div class="headline tape">最終結果</div>';
      status = "おつかれさまでした";
    }
    el("main").innerHTML = main;
    el("status").innerHTML = status;
  }

  // ---- 部門のカード ----------------------------------------------------

  // 途中順位と最終結果は順位で並べ、順位を出す
  function isRanked(s) { return s.state === STATE.ROUND_RESULT || s.state === STATE.FINISHED; }

  function ordered(s) {
    var teams = s.teams.slice();
    if (isRanked(s)) {
      teams.sort(function (a, b) { return (a.rank - b.rank) || (a.number - b.number); });
    }
    return teams;
  }

  function slot(s, t) {
    if (s.state === STATE.ANSWERING) {
      if (t.answered) return '<div class="slot done">✓ 回答済み</div>';
      return '<div class="slot">' + (t.eliminated ? "（脱落）" : "考え中…") + "</div>";
    }
    var opened = s.state === STATE.OPEN || s.state === STATE.REVEAL;
    var damageShown = s.state === STATE.REVEAL && !stagePhase;  // 前半のあいだは減る数も出さない
    if (isRanked(s) && t.damage != null) {
      return '<div class="slot"><span class="note">第' + s.round + "問 " +
        (t.damage > 0 ? "<b>−" + t.damage + "</b>" : (t.error === 0 ? "ぴったり" : "±0")) + "</span></div>";
    }
    if (!opened) return '<div class="slot"></div>';
    var guess = t.answer == null
      ? '<span class="guess">―</span>'
      : '<span class="guess">' + t.answer + "<small>%</small></span>";
    var dmg = "";
    if (damageShown && t.damage != null) {
      if (t.damage > 0) dmg = '<span class="dmg tape">−' + t.damage + "</span>";
      else if (t.error === 0) dmg = '<span class="dmg tape zero">ぴったり!</span>';
      else dmg = '<span class="dmg tape zero">±0</span>';  // 脱落済みで減らない
    }
    return '<div class="slot flip">' + guess + dmg + "</div>";
  }

  function card(s, t) {
    var cls = ["card"];
    if (s.state === STATE.ANSWERING && t.answered) cls.push("answered");
    // この問題で脱落する部門は、正解発表の数え下げが0に届いたときに灰色にする（tick）。前の問題までに脱落した部門は最初から灰色
    var outNow = t.eliminated && (s.state !== STATE.REVEAL || !(t.damage > 0));
    if (outNow) cls.push("out");
    var ranked = isRanked(s);
    if (ranked && t.rank === 1) cls.push("top1");
    var start = displayedBalloons(s, t);
    return '<div class="' + cls.join(" ") + '" data-team="' + t.number + '">' +
      '<div class="head"><div class="name">' + esc(t.name) + "</div></div>" +
      // 脱落の札と順位は数字の右に出す（部門名の横に置くと「ステージイベント」が切れる。
      // 下の欄に重ねると文字が隠れる。正解発表では数え下げが0に届いてから灰色にする）
      '<div class="count-row"><div class="count"><span class="n">' + start + "</span><small>個</small></div>" +
      '<div class="side">' + (outNow ? '<div class="badge tape">脱落</div>' : "") +
      (ranked ? '<div class="rank">' + t.rank + "位</div>" : "") + "</div></div>" +
      '<div class="meter"><i style="width:' + start + '%"></i></div>' +
      slot(s, t) + pops(s, t) +
      "</div>";
  }

  // 後半の始めに、減る数の分（絵は MAX_POPS まで）の風船をカードに浮かべる。tick が数え下げに合わせて割る
  function pops(s, t) {
    if (s.state !== STATE.REVEAL || countStart === null || !(t.damage > 0)) return "";
    var n = Math.min(t.damage, MAX_POPS), html = "";
    for (var i = 0; i < n; i++) {
      // 置き場所と色はカードと順番から決める（描き直しても同じ並びになる）
      var x = ((i * 37 + t.number * 13) % 86), y = ((i * 53 + t.number * 29) % 52);
      var hue = HUES[(i * 3 + t.number) % HUES.length];
      html += '<span class="pop" data-at="' + ((i + 1) / n).toFixed(3) + '" style="left:' + x + "%;top:" + y +
        "%;animation-delay:" + (i * 40) + 'ms"><i><img src="' + BALLOON_IMG + '" alt="" style="filter:hue-rotate(' + hue + 'deg) saturate(1.3)"></i></span>';
    }
    return '<div class="pops" aria-hidden="true">' + html + "</div>";
  }

  function countProgress() {
    var p = Math.min(1, (performance.now() - countStart) / REVEAL_COUNT_MS);
    return 1 - Math.pow(1 - p, 3);
  }

  // 正解発表のあいだは、発表前の数から今の数へ数え下げる（前半のあいだは発表前の数のまま）
  function displayedBalloons(s, t) {
    if (s.state !== STATE.REVEAL || !t.damage) return t.balloons;
    if (countStart === null) return stagePhase ? t.balloons + t.damage : t.balloons;
    return Math.round(t.balloons + t.damage * (1 - countProgress()));
  }

  function renderGrid(s) {
    var teams = ordered(s);
    if (!teams.length) { el("grid").innerHTML = '<div class="empty">参加する部門がありません</div>'; return; }
    // 2段に分ける（10なら5と5、9なら5と4、7なら4と3）。1段に5枚まで
    var rows = teams.length <= 5 ? [teams] : [teams.slice(0, Math.ceil(teams.length / 2)), teams.slice(Math.ceil(teams.length / 2))];
    el("grid").innerHTML = rows.map(function (row) {
      return '<div class="row">' + row.map(function (t) { return card(s, t); }).join("") + "</div>";
    }).join("");
  }

  // 数字と横棒だけを書き換える（カードを作り直すとめくりの動きがやり直しになる）
  function tick() {
    var s = current;
    if (s && s.state === STATE.REVEAL && countStart !== null) {
      s.teams.forEach(function (t) {
        var node = document.querySelector('.card[data-team="' + t.number + '"]');
        if (!node) return;
        var n = displayedBalloons(s, t);
        node.querySelector(".n").textContent = n;
        node.querySelector(".meter i").style.width = n + "%";
        if (t.eliminated && n === 0) node.classList.add("out");
      });
      var eased = countProgress();
      document.querySelectorAll(".pop:not(.gone)").forEach(function (p) {
        if (eased + 1e-6 >= Number(p.dataset.at)) { p.classList.add("gone"); sound.pop(eased); }
      });
    }
    stage.watch();
    requestAnimationFrame(tick);
  }

  // ---- 音（Scratch の効果音。ブラウザの決まりで、画面を1回クリックするまで鳴らせない） ------------

  var sound = (function () {
    var ctx = null, buffers = {}, lastPop = 0;
    function load(url) {
      fetch(url).then(function (r) { if (!r.ok) throw new Error(); return r.arrayBuffer(); })
        .then(function (data) { return ctx.decodeAudioData(data); })
        .then(function (buf) { buffers[url] = buf; })
        .catch(function () { /* 素材がなければ鳴らさない */ });
    }
    function play(url, rate) {
      if (!ctx || !buffers[url]) return;
      var src = ctx.createBufferSource();
      src.buffer = buffers[url];
      src.playbackRate.value = rate || 1;
      src.connect(ctx.destination);
      src.start();
    }
    function unlock() {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!ctx && Ctx) { ctx = new Ctx(); load(POP_SOUND); load(DOVE_SOUND); }
      if (ctx && ctx.state === "suspended") ctx.resume();
      stage.unlock();
      el("sound").hidden = true;
    }
    el("sound").addEventListener("click", unlock);
    document.addEventListener("pointerdown", unlock);
    return {
      // 進み具合（0〜1）に合わせて音程を上げる（元の Scratch と同じ鳴らし方）
      pop: function (progress) {
        var now = performance.now();
        if (now - lastPop < POP_GAP_MS) return;
        lastPop = now;
        play(POP_SOUND, 1 + progress * 1.2);
      },
      dove: function () { play(DOVE_SOUND); },
    };
  })();

  // 後半の始めに、Scratch の「割る奴」（鳩）を画面の右から左へ飛ばす
  function flyDove() {
    var img = document.createElement("img");
    img.className = "dove"; img.src = DOVE_IMGS[0]; img.alt = "";
    var flap = 0, timer = setInterval(function () { flap = 1 - flap; img.src = DOVE_IMGS[flap]; }, 200);
    function done() { clearInterval(timer); img.remove(); }
    img.addEventListener("animationend", done);
    img.addEventListener("error", done);
    setTimeout(done, 4000);  // 動きを減らす設定で animationend が来ないとき
    document.body.appendChild(img);
    sound.dove();
  }

  // ---- Scratch のステージ画面（正解発表の前半） -------------------------------
  // 書き出した /stage/view/ を iframe で開き、同じオリジンなので中の Scratch（vm）の変数を直接書いて動かす。
  // クラウド変数のつながりは切る（部門対抗では裏方PCが値を送らないので、サーバに残った値で動かないように）。
  // Scratch は1チーム分の画面なので、チーム1・風船100で「回答受付」を組み立てておき、正解発表で
  // 予想を隠し（予想%消して）、鳥を出さず（エキシビション）、ゲージが伸びて正解が出るところだけを見せる。
  // 高専祭の札・問題文の絵・問題番号・残り・誤差は毎コマ隠し、問題文と「正解」の札は上に重ねる。

  var stage = (function () {
    var frame = el("stage-frame"), wrap = el("stage-wrap");
    var vm = null, seq = 0, preparedQid = null, preparedAt = 0, playing = null, unlocked = false;
    var fadeTimer = null, muteTimer = null;

    function vars() { return vm.runtime.getTargetForStage().variables; }
    function find(target, name) {
      var vs = target.variables;
      for (var id in vs) if (vs[id].name === name) return vs[id];
      return null;
    }
    function get(name) { var v = find(vm.runtime.getTargetForStage(), name); return v ? String(v.value) : null; }
    // 「通信」スプライトだけの変数（最後に処理した状態）
    function seen(name) {
      var t = vm.runtime.getSpriteTargetByName("通信"), v = t && find(t, name);
      return v ? String(v.value) : null;
    }
    function set(values) {
      // サーバに残っていた値（つなぐ前に届いたもの）と同じ番号にならないよう、今の値より先へ進める
      seq = Math.max(seq, Number(get("☁ P2S_SEQ")) || 0) + 1;
      values["☁ P2S_SEQ"] = seq;  // 最後に書く（Scratch は SEQ の変化を見て、ほかの値を読む）
      var stageVars = vars();
      Object.keys(values).forEach(function (name) {
        for (var id in stageVars) if (stageVars[id].name === name) stageVars[id].value = String(values[name]);
      });
    }
    function volume(on) {
      var engine = vm && vm.runtime.audioEngine;
      if (engine && engine.inputNode) engine.inputNode.gain.value = on ? 1 : 0;
    }
    function hideFestivalParts() {
      vm.runtime.targets.forEach(function (t) {
        if (t.isStage || !t.visible) return;
        var name = t.sprite.name, costume = t.getCostumes()[t.currentCostume].name;
        if (name === "問題" || name === "問題数" || name === "予想" || name === "UI_結果演出" || name === "GameOver" ||
            (name === "UI" && costume !== "風船" && costume !== "カゴ") ||   // チームの札・残り・誤差・エキシビションの表示
            (name === "UI_オーバーレイ" && costume.indexOf("問題枠") === 0) ||
            (name === "数字" && t.x > 120)) {                                 // 右側の数字（残り・誤差）。正解は真ん中に出る
          t.setVisible(false);
        }
      });
    }
    function attach() {
      var win = frame.contentWindow, doc = frame.contentDocument;
      var launch = doc && doc.getElementById("launch");
      // 読み込みが終わると、Packager は「クリックで開始」の画面を出す
      if (!win || !win.vm || !launch || launch.hidden) return false;
      vm = win.vm;
      var style = doc.createElement("style");
      style.textContent = ".standalone-fullscreen-button, #launch { display: none !important; }";
      doc.head.appendChild(style);
      var vs = vars();
      for (var id in vs) if (vs[id].name.indexOf("☁ ") === 0) vs[id].isCloud = false;
      vm.runtime.on("AFTER_EXECUTE", hideFestivalParts);  // 描く直前に毎コマ隠す（スクリプトが出し直しても負けない）
      volume(false);
      launch.click();  // 緑の旗
      if (unlocked) resume();
      return true;
    }
    function resume() {
      var engine = vm && vm.runtime.audioEngine;
      if (engine && engine.audioContext && engine.audioContext.state === "suspended") engine.audioContext.resume();
    }
    // 回答受付の組み立てを Scratch が終えたか（終える前に正解発表を書くと、演出を飛ばして作り直してしまう）
    function built(qid) {
      // 回答中 は作り直しの終わり近くで 1 になる（前の問題の正解発表のあとは 3 か 4）。
      // 作り直しの始めの「待つ」のあいだは 見た〜 だけが新しいので、頼んでから少したつまでは見ない
      return performance.now() - preparedAt >= 300 && get("回答中") === "1" && seen("見たSTATE") === "3" && seen("見たQID") === String(qid) && get("復帰描画中") === "0" &&
        get("途中復帰") === "0" && get("☁ P2S_SEQ") === seen("見たSEQ");
    }
    function begin(s) {
      set({ "予想%消して": 1, "エキシビション": 1, "☁ P2S_CORRECT": s.correct, "☁ P2S_STATE": 4 });
      el("stage-round").textContent = "第" + s.round + "問";
      el("stage-q").textContent = s.question.text;
      el("stage-label").textContent = "正解は…";
      clearTimeout(muteTimer);
      volume(true);
      wrap.classList.add("on");
      playing.start = performance.now();
    }

    var tries = 0, poller = setInterval(function () {
      tries += 1;
      try { if (attach()) clearInterval(poller); } catch (e) { /* まだ読み込み中 */ }
      if (tries > 120) clearInterval(poller);  // 1分たっても読めなければあきらめる（後半だけで進む）
    }, 500);
    frame.src = "stage/view/";

    return {
      unlock: function () { unlocked = true; resume(); },
      // 回答受付・予想オープンのあいだに、その問題の「回答受付」を組み立てておく（2〜3秒かかる）
      prepare: function (s) {
        if (!vm || !s.question || preparedQid === s.question.id) return;
        preparedQid = s.question.id;
        preparedAt = performance.now();
        set({
          "☁ P2S_STATE": 3, "☁ P2S_TEAM": 1, "☁ P2S_ROUND": ((s.round - 1) % 4) + 1,  // 5問目はクリアの演出が混ざるので使わない
          "☁ P2S_QID": s.question.id, "☁ P2S_BALLOONS": 100, "☁ P2S_ANSWER": -1, "☁ P2S_CORRECT": -1,
          "☁ P2S_FAILED_ROUND": 0,
        });
      },
      // 正解発表を流せるか（組み立てを頼まずに正解発表を開いたときは流さない）
      ready: function (s) { return !!vm && !!s.question && preparedQid === s.question.id; },
      // 組み立てが終わっていなければ少し待ってから始める（PREPARE_WAIT_MS で間に合わなければ後半へ）
      play: function (s, done) {
        clearTimeout(fadeTimer);
        playing = { s: s, asked: performance.now(), start: null, shown: null, done: done };
        if (built(s.question.id)) begin(s);
      },
      // tick から毎コマ呼ぶ。正解が出たら（回答中 が 3 になる）少し見せてから大画面に戻る
      watch: function () {
        if (!playing) return;
        var now = performance.now(), finish = false;
        if (playing.start === null) {
          if (built(playing.s.question.id)) begin(playing.s);
          else if (now - playing.asked >= PREPARE_WAIT_MS) finish = true;
        } else {
          if (playing.shown === null && get("回答中") === "3") {
            playing.shown = now;
            el("stage-label").textContent = "正解 ▶";
          }
          finish = (playing.shown !== null && now - playing.shown >= STAGE_AFTER_CORRECT_MS) ||
            now - playing.asked >= STAGE_TIMEOUT_MS;
        }
        if (finish) {
          var done = playing.done, shownStage = playing.start !== null;
          this.stop();
          if (shownStage) fadeTimer = setTimeout(done, STAGE_FADE_MS);
          else done();
        }
      },
      stop: function () {
        playing = null;
        clearTimeout(fadeTimer);
        wrap.classList.remove("on");
        clearTimeout(muteTimer);
        muteTimer = setTimeout(function () { volume(false); }, STAGE_FADE_MS);
      },
    };
  })();

  // 正解発表の後半：カードを描き直して（予想のめくりと風船を出す）数え下げを始める
  function startCount() {
    var s = current;
    stagePhase = false;
    if (!s || s.state !== STATE.REVEAL) return;
    countStart = performance.now();
    renderTop(s);
    renderGrid(s);
    if (s.teams.some(function (t) { return t.damage > 0; })) flyDove();
  }

  function render(s) {
    if (!s || s.mode !== "battle") {
      if (stagePhase) { stagePhase = false; stage.stop(); }
      current = null; lastKey = null; render.sig = null;
    }
    if (!s) { el("grid").innerHTML = ""; el("main").innerHTML = '<div class="question small">まもなく始まります</div>'; return; }
    if (s.mode !== "battle") {
      el("grid").innerHTML = '<div class="empty">いまは部門対抗モードではありません</div>';
      el("main").innerHTML = ""; el("status").textContent = ""; return;
    }
    var key = s.state + ":" + s.round;
    var answered = s.teams.map(function (t) { return t.answered ? 1 : 0; }).join("");
    // 回答受付中は回答済みの印だけが変わるので、変わったときに描き直す
    var sig = key + "|" + answered + "|" + s.teams.length + "|" + s.teams.map(function (t) { return t.number; }).join(",");
    var fresh = key !== lastKey;
    current = s;
    lastKey = key;
    if (s.state === STATE.ANSWERING || s.state === STATE.OPEN) stage.prepare(s);
    if (fresh) {
      countStart = null;
      if (stagePhase) { stagePhase = false; stage.stop(); }  // 前半の途中で進んだ（開き直し・送り直し）
      if (s.state === STATE.REVEAL) {
        if (stage.ready(s)) {
          stagePhase = true;  // 大画面は発表前の数のまま、上に Scratch の画面を重ねる。終わったら startCount
          stage.play(s, startCount);
        } else {
          startCount();  // Scratch の画面がない・間に合わないときは、すぐ後半へ
          render.sig = sig;
          return;
        }
      }
    }
    if (fresh || sig !== render.sig) {
      renderTop(s);
      renderGrid(s);
      render.sig = sig;
    }
  }

  poll();
  setInterval(poll, POLL_MS);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
