<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>部門対抗 スズリーグ</title>
<!--
  部門対抗モード（振り返り会 2026-12-03）の大画面。プロジェクターに映す、入力のない画面。
  Render（cloud-server の public/board.html）から配信し、1秒ごとに公開用の状態（api/player/state）を読む。
  元ファイルは suzuleague リポジトリの src/suzuleague/board.html。書き出しは uv run python -m suzuleague.publish。
  設計は docs/furikaeri/design.md の「大画面ページ」。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@700;900&display=swap">
<style>
  /* 見た目は高専祭の公式HP（テーマ「collage」）のデザインシステムに合わせる。
     白い紙に、赤・青・黄・黒のテープとハードシャドウのカードを貼る。色は HP の global.css と同じ値 */
  :root {
    --blue: #1a33d6;
    --red: #e31b23;
    --yellow: #f4d21f;
    --ink: #111111;
    --paper: #f8f8f8;
    --grey: #8c8c8c;
    --font-body: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    --font-num: "Bebas Neue", "Impact", "Arial Black", sans-serif;
  }
  * { box-sizing: border-box; }
  /* 画面は 16:10 より横長を前提に作ってある。4:3 などの縦長の画面では、横幅に合わせた 16:10 の枠に
     収めて上下を余白にする（崩れないように）。中の寸法は vh ではなく、枠の高さの 1% の --h を単位にして書く
     （16:10 より横長の画面では --h は 1vh と同じ） */
  /* --band は 4:3 などで枠の上下にできる余白の高さ（16:10 より横長なら 0）。★の飾りは、これを足して枠を基準に置く（中身に重ならない位置） */
  :root { --h: min(1vh, .625vw); --band: calc((100vh - 100 * var(--h)) / 2); }
  html {
    margin: 0; height: 100%; background: var(--paper);
    display: flex; align-items: center;
  }
  body {
    margin: 0;
    position: relative;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    display: flex; flex-direction: column;
    width: 100vw; height: calc(100 * var(--h)); flex: none;
    padding: calc(2.6 * var(--h)) 2.6vw calc(3 * var(--h));
    gap: calc(2.2 * var(--h));
  }
  /* 紙の質感（HP の body::after と同じノイズ） */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.9" numOctaves="4" seed="11"/><feColorMatrix type="saturate" values="0"/></filter><rect width="240" height="240" filter="url(%23n)"/></svg>');
    background-size: 240px 240px; opacity: .1; mix-blend-mode: multiply;
  }
  .num { font-family: var(--font-num); letter-spacing: .01em; }
  [hidden] { display: none !important; }

  /* ---- テープ（文字にはフィルタを掛けず、::before の地にだけ掛ける） ---- */
  .tape { position: relative; z-index: 0; display: inline-block; font-weight: 900; }
  .tape::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: var(--tape-bg, var(--ink)); filter: url(#tape-edge);
  }

  /* ---- 四隅の貼り紙（飾り。内容の後ろに敷く） ---- */
  .deco { position: fixed; pointer-events: none; z-index: 0; }
  .deco.dots {
    top: calc(-5 * var(--h)); left: calc(-4 * var(--h)); width: calc(26 * var(--h)); height: calc(20 * var(--h)); transform: rotate(-9deg);
    background: #fff radial-gradient(circle, var(--ink) 30%, transparent 33%) 0 0 / calc(2.2 * var(--h)) calc(2.2 * var(--h));
    filter: url(#torn-edge);
  }
  .deco.check {
    top: calc(-3 * var(--h)); right: calc(-3 * var(--h)); width: calc(22 * var(--h)); height: calc(15 * var(--h)); transform: rotate(7deg);
    background: repeating-conic-gradient(var(--blue) 0 25%, #fff 0 50%) 0 0 / calc(3 * var(--h)) calc(3 * var(--h));
    filter: url(#torn-edge);
  }
  .deco.stripe {
    bottom: calc(-4 * var(--h)); left: calc(-5 * var(--h)); width: calc(30 * var(--h)); height: calc(11 * var(--h)); transform: rotate(8deg);
    background: repeating-linear-gradient(45deg, var(--red) 0 calc(1.1 * var(--h)), #fff calc(1.1 * var(--h)) calc(2.2 * var(--h)));
    filter: url(#torn-edge);
  }
  .deco.bluedots {
    bottom: calc(-6 * var(--h)); right: calc(-4 * var(--h)); width: calc(28 * var(--h)); height: calc(18 * var(--h)); transform: rotate(-6deg);
    background: #fff radial-gradient(circle, var(--blue) 32%, transparent 35%) 0 0 / calc(1.8 * var(--h)) calc(1.8 * var(--h));
    filter: url(#torn-edge);
  }
  .deco.star { font-family: var(--font-num); line-height: 1; }
  .deco.s1 { top: calc(var(--band) + 10 * var(--h)); right: .3vw; font-size: calc(5 * var(--h)); color: var(--red); transform: rotate(14deg); }
  .deco.s3 { top: calc(var(--band) + 1.6 * var(--h)); left: 44vw; font-size: calc(3.4 * var(--h)); color: var(--blue); transform: rotate(8deg); }

  /* ---- 上部（タイトル・問題・正解） ---- */
  .top, .grid { position: relative; z-index: 1; }
  .top { display: flex; flex-direction: column; gap: calc(1.6 * var(--h)); min-height: calc(28 * var(--h)); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
  .brand {
    font-size: calc(3 * var(--h)); letter-spacing: .08em; color: #fff;
    padding: calc(.7 * var(--h)) 1.8vw; transform: rotate(-1.6deg); margin-left: 1vw;
  }
  .brand b { color: var(--yellow); }
  .round {
    --tape-bg: var(--red); color: #fff; font-size: calc(3.2 * var(--h)); padding: calc(.6 * var(--h)) 1.8vw; transform: rotate(1.4deg);
  }
  .tag {
    --tape-bg: var(--yellow); color: var(--ink); font-size: calc(2.2 * var(--h)); letter-spacing: 0;
    padding: calc(.3 * var(--h)) 1vw; margin-left: 1.2vw; transform: rotate(3deg); vertical-align: middle;
  }
  .main-line {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 3.4vw;
    text-align: center;
  }
  /* 問題文は、黄色いテープで留めた白いカードに載せる */
  .question {
    position: relative; max-width: 86vw;
    font-size: calc(5.2 * var(--h)); font-weight: 900; line-height: 1.4; text-wrap: balance;
    word-break: auto-phrase;  /* 「未来」などの言葉の途中で改行しない（Chrome。ほかのブラウザでは無視される） */
    background: #fff; border: calc(.3 * var(--h)) solid var(--ink); box-shadow: calc(.9 * var(--h)) calc(.9 * var(--h)) 0 var(--ink);
    padding: calc(2.4 * var(--h)) 2.8vw calc(2.2 * var(--h)); transform: rotate(-.6deg);
  }
  .question::before {
    content: ""; position: absolute; top: calc(-1.6 * var(--h)); left: 3vw; width: calc(14 * var(--h)); height: calc(3.2 * var(--h));
    background: var(--yellow); transform: rotate(-4deg); filter: url(#tape-edge);
  }
  .question.small { font-size: calc(3.4 * var(--h)); max-width: 52vw; text-align: left; }
  .correct {
    display: flex; align-items: center; gap: 1.6vw; white-space: nowrap;
    animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  .correct b {
    --tape-bg: var(--yellow); font-family: var(--font-num); font-weight: 400;
    font-size: calc(19 * var(--h)); line-height: .95; padding: calc(1.6 * var(--h)) 2.4vw 0; transform: rotate(2deg);
  }
  .correct b small { font-size: calc(9 * var(--h)); }
  .headline { color: #fff; font-size: calc(6.6 * var(--h)); letter-spacing: .04em; padding: calc(1.2 * var(--h)) 2.6vw; transform: rotate(-1.2deg); }
  .headline.win {
    --tape-bg: var(--red); font-size: calc(8.6 * var(--h)); padding: calc(1.4 * var(--h)) 3vw; white-space: nowrap;
    animation: pop .6s cubic-bezier(.2,1.6,.4,1);
  }
  .win-wrap { display: flex; align-items: center; gap: 2vw; }
  .win-wrap .star { font-family: var(--font-num); line-height: 1; font-size: calc(11 * var(--h)); }
  .win-wrap .star.l { color: var(--yellow); transform: rotate(-14deg); }
  .win-wrap .star.r { color: var(--blue); transform: rotate(12deg); }

  /* 待機中：ルールのカードと QR */
  .rules {
    position: relative; text-align: left; font-size: min(calc(3.2 * var(--h)), 1.8vw); font-weight: 700; line-height: 1.85;
    background: #fff; border: calc(.3 * var(--h)) solid var(--ink); box-shadow: calc(.9 * var(--h)) calc(.9 * var(--h)) 0 var(--ink);
    padding: calc(2.6 * var(--h)) 2.6vw calc(2.2 * var(--h)); transform: rotate(-.8deg);
  }
  .rules::before {
    content: ""; position: absolute; top: calc(-1.5 * var(--h)); right: 3vw; width: calc(13 * var(--h)); height: calc(3 * var(--h));
    background: var(--blue); transform: rotate(5deg); filter: url(#tape-edge);
  }
  .rules b { font-weight: 900; background: linear-gradient(transparent 58%, var(--yellow) 58%); }
  .qr { display: flex; align-items: center; gap: 2vw; text-align: left; transform: rotate(1deg); }
  .qr .code { --tape-bg: var(--yellow); padding: calc(1.8 * var(--h)); }
  .qr svg { display: block; width: calc(23 * var(--h)); height: calc(23 * var(--h)); background: #fff; padding: calc(.6 * var(--h)); }
  .qr div { font-size: min(calc(2.7 * var(--h)), 1.52vw); font-weight: 700; line-height: 1.7; }
  .qr div b { --tape-bg: var(--blue); color: #fff; white-space: nowrap; font-size: min(calc(3 * var(--h)), 1.69vw); padding: calc(.4 * var(--h)) 1.2vw; margin-bottom: calc(1.2 * var(--h)); transform: rotate(-2deg); }
  .qr .teams { display: block; margin-top: calc(1.2 * var(--h)); font-size: min(calc(3 * var(--h)), 1.69vw); font-weight: 900; }
  .qr .teams em { font-style: normal; color: var(--red); }
  .status-line { text-align: center; font-size: calc(3.2 * var(--h)); font-weight: 700; }
  .status-line b { font-weight: 900; color: var(--red); }

  /* ---- 部門のカード（白地・黒枠・ハードシャドウ。少しずつ傾けて貼る） ---- */
  .grid { flex: 1; display: flex; flex-direction: column; gap: calc(3 * var(--h)); justify-content: center; }
  .row { display: flex; gap: 1.6vw; justify-content: center; flex: 1; max-height: calc(31 * var(--h)); }
  .card {
    position: relative; width: 17.4vw;
    background: #fff; border: calc(.3 * var(--h)) solid var(--ink); box-shadow: calc(.7 * var(--h)) calc(.7 * var(--h)) 0 var(--ink);
    padding: calc(2.2 * var(--h)) 1vw calc(1.4 * var(--h)); display: flex; flex-direction: column; gap: calc(.8 * var(--h));
    transform: rotate(var(--tilt, 0deg));
    transition: transform .6s, opacity .4s, background .3s, box-shadow .3s;
  }
  .row .card:nth-child(4n+1) { --tilt: -.9deg; --tape-bg: var(--yellow); }
  .row .card:nth-child(4n+2) { --tilt: .7deg;  --tape-bg: var(--red); }
  .row .card:nth-child(4n+3) { --tilt: -.4deg; --tape-bg: var(--blue); }
  .row .card:nth-child(4n+4) { --tilt: 1deg;   --tape-bg: var(--yellow); }
  .row:nth-child(2) .card:nth-child(odd) { --tilt: .8deg; }
  .card::before {
    content: ""; position: absolute; top: calc(-1.4 * var(--h)); left: 50%; width: calc(10 * var(--h)); height: calc(2.6 * var(--h)); margin-left: calc(-5 * var(--h));
    background: var(--tape-bg); transform: rotate(-3deg); filter: url(#tape-edge);
  }
  .card.answered { box-shadow: calc(.7 * var(--h)) calc(.7 * var(--h)) 0 var(--blue); border-color: var(--blue); }
  .card.out {
    background: repeating-linear-gradient(135deg, #f1f1f1 0 calc(1 * var(--h)), #e6e6e6 calc(1 * var(--h)) calc(2 * var(--h)));
    border-color: var(--grey); box-shadow: calc(.7 * var(--h)) calc(.7 * var(--h)) 0 var(--grey);
  }
  .card.out::before { background: #bdbdbd; }
  .card.out .name, .card.out .count, .card.out .count small { color: var(--grey); }
  .card.top1 { background: var(--yellow); }
  .card.top1::after {
    content: "★"; position: absolute; top: calc(-3.4 * var(--h)); right: -1.4vw; font-family: var(--font-num);
    font-size: calc(7 * var(--h)); line-height: 1; color: var(--red); transform: rotate(16deg);
  }
  .head { display: flex; align-items: center; gap: .6vw; }
  .name {
    /* 横幅の狭い画面（4:3 など）でも最長の「ステージイベント」が1行に入るよう、幅でも上限を決める */
    flex: 1; min-width: 0; font-size: min(calc(2.8 * var(--h)), 1.75vw); font-weight: 900; line-height: 1.25; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .count-row { display: flex; align-items: flex-end; justify-content: space-between; gap: .6vw; }
  .side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: calc(.8 * var(--h)); padding-bottom: calc(.4 * var(--h)); }
  .rank { flex: none; font-size: calc(3.2 * var(--h)); font-weight: 900; line-height: 1; }
  .card.top1 .rank { color: var(--red); }
  .count {
    font-family: var(--font-num); font-size: calc(9.6 * var(--h)); line-height: .9; color: var(--red); white-space: nowrap;
  }
  .count small { font-family: var(--font-body); font-size: calc(2.3 * var(--h)); font-weight: 900; color: var(--ink); margin-left: .3vw; }
  .meter { height: calc(1.7 * var(--h)); border: calc(.25 * var(--h)) solid var(--ink); background: #fff; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--red); transition: width .25s linear; }
  .card.out .meter { border-color: var(--grey); }
  .card.out .meter i { background: var(--grey); }
  .slot {
    margin-top: auto; min-height: calc(6.8 * var(--h)); border: calc(.25 * var(--h)) dashed var(--ink); background: rgba(255,255,255,.7);
    display: flex; align-items: center; justify-content: center; gap: .8vw;
    font-size: calc(2.6 * var(--h)); font-weight: 700; color: #555;
  }
  .card.out .slot { border-color: var(--grey); }
  .slot.done { background: var(--blue); border: calc(.25 * var(--h)) solid var(--blue); color: #fff; font-weight: 900; }
  .slot .guess { font-family: var(--font-num); font-size: min(calc(6.4 * var(--h)), 3.6vw); line-height: 1; color: var(--ink); padding-top: calc(.6 * var(--h)); }
  .slot .guess small { font-size: calc(3.2 * var(--h)); }
  .slot .note { font-size: calc(2.4 * var(--h)); font-weight: 900; color: var(--ink); white-space: nowrap; }
  .slot .note b { font-family: var(--font-num); font-weight: 400; color: var(--red); font-size: calc(3.8 * var(--h)); vertical-align: calc(-.3 * var(--h)); }
  .slot.flip { animation: flip .5s ease-out backwards; }
  .badge {
    --tape-bg: var(--ink); flex: none; color: #fff; font-size: calc(1.9 * var(--h)); padding: calc(.2 * var(--h)) .6vw; transform: rotate(-4deg);
  }

  /* ---- 正解発表の後半：各カードのバルーン数が「−12」の札と一緒に数え下がる ---- */
  /* 減る数の札は、数字の右（脱落の札・順位と同じ欄）に貼る。数え下げの前に貼りつく */
  .side .dmg {
    --tape-bg: var(--red); font-family: var(--font-num); font-weight: 400; font-size: min(calc(5 * var(--h)), 2.8vw); line-height: 1;
    color: #fff; padding: calc(.8 * var(--h)) .55vw calc(.2 * var(--h)); transform: rotate(-4deg);
    animation: stamp .35s cubic-bezier(.3,1.5,.5,1) backwards;
  }
  .side .dmg.zero {
    --tape-bg: var(--yellow); font-family: var(--font-body); font-weight: 900; color: var(--ink);
    /* 「100個」の横でもカードからはみ出さない大きさ（11/19 に1920×1080と4:3で確認） */
    font-size: min(calc(2.2 * var(--h)), 1.15vw); padding: calc(.5 * var(--h)) .4vw; white-space: nowrap;
  }
  /* 数え下げのあいだ、数字は1つ減るたびに小さく弾む */
  .count .n { display: inline-block; }
  .count .n.bump { animation: bump .16s ease-out; }
  /* 横棒は、減る分を黄色の斜線で残し、数え下げに合わせて縮める */
  .meter { position: relative; }
  .meter b {
    position: absolute; top: 0; bottom: 0; display: block;
    background: repeating-linear-gradient(135deg, var(--yellow) 0 calc(.6 * var(--h)), var(--ink) calc(.6 * var(--h)) calc(.9 * var(--h)));
  }
  .badge.new { animation: stamp .35s cubic-bezier(.3,1.5,.5,1) backwards; }
  @keyframes stamp { from { transform: scale(2.2) rotate(-12deg); opacity: 0; } to { opacity: 1; } }
  @keyframes bump { 50% { transform: translateY(calc(.5 * var(--h))) scale(1.06); } }

  /* ---- 正解発表の前半：予想のピンとゲージ（大画面の上に重ねる。11/19 に Scratch の画面から作り直した） ---- */
  /* 上に問題文、中ほどに各部門の予想のピン（名札と棒）、下に 0〜100 の目盛りのついたゲージを置く。
     ゲージが伸びて正解の位置で止まり、ゲージの先についている数字の札が大きくなる。
     動きは経過時間から毎コマ計算する（reveal.frame）。
     消すとき（.leaving）は、四隅の飾りを残して地とほかの部品を薄くし、下のカードの画面を見せる。
     そのあいだに、正解の札（.rv-fly）がカードの画面の上の正解の位置まで飛んでいく */
  .rv {
    position: fixed; inset: 0; z-index: 40; background: var(--paper); overflow: hidden;
    opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s;
  }
  .rv.on { opacity: 1; visibility: visible; transition: opacity .4s; }
  /* 先にピンとゲージを 0.4 秒で消し、そのあと地を薄くする（問題文が二重に見えないように）。
     四隅の飾りは下の画面と同じ位置にあるので、一緒に消しても見た目は変わらない */
  .rv.leaving { background-color: transparent; transition: background-color .7s ease-in-out .35s; }
  .rv > .deco, .rv-q, .rv-pins, .rv-track, .rv-tip, .rv-ticks { transition: opacity .4s ease-in; }
  .rv.leaving > .deco, .rv.leaving .rv-q, .rv.leaving .rv-pins, .rv.leaving .rv-track, .rv.leaving .rv-tip, .rv.leaving .rv-ticks { opacity: 0 !important; }
  .rv.leaving .rv-ans { visibility: hidden; }
  .rv-fly {
    position: fixed; z-index: 41; transform-origin: 0 0; animation: none; pointer-events: none;
    transition: transform 1s cubic-bezier(.55, 0, .2, 1);
  }
  .rv-frame { position: absolute; left: 0; right: 0; top: var(--band); height: calc(100 * var(--h)); }
  .rv-q {
    position: absolute; left: 50%; top: calc(5 * var(--h)); width: max-content; max-width: 84vw; transform: translateX(-50%) rotate(-.6deg);
    background: #fff; border: calc(.3 * var(--h)) solid var(--ink); box-shadow: calc(.8 * var(--h)) calc(.8 * var(--h)) 0 var(--ink);
    font-size: calc(3.6 * var(--h)); font-weight: 900; line-height: 1.4; text-align: center; text-wrap: balance; word-break: auto-phrase;
    padding: calc(1.5 * var(--h)) 2.4vw;
  }
  .rv-q::before {
    content: ""; position: absolute; top: calc(-1.4 * var(--h)); left: 2.4vw; width: calc(12 * var(--h)); height: calc(2.8 * var(--h));
    background: var(--yellow); transform: rotate(-4deg); filter: url(#tape-edge);
  }
  /* ゲージ（白地に黒枠。伸びた分は赤の斜線） */
  .rv-gauge { position: absolute; left: 6vw; right: 6vw; top: calc(64 * var(--h)); height: calc(10 * var(--h)); }
  .rv-track {
    position: absolute; inset: 0; overflow: hidden;
    background: #fff; border: calc(.4 * var(--h)) solid var(--ink); box-shadow: calc(.8 * var(--h)) calc(.8 * var(--h)) 0 var(--ink);
  }
  .rv-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: repeating-linear-gradient(135deg, var(--red) 0 calc(2 * var(--h)), #c8141b calc(2 * var(--h)) calc(4 * var(--h)));
  }
  .rv-grid { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(17,17,17,.18) calc(10% - 2px) 10%); }
  .rv-tip { position: absolute; left: 0; top: calc(-1.6 * var(--h)); bottom: calc(-1.6 * var(--h)); width: calc(.7 * var(--h)); margin-left: calc(-.35 * var(--h)); background: var(--ink); }
  /* 目盛り（5 ごとに短い線、10 ごとに長い線と数字） */

      var inline = chars <= 20;
      main = s.winners.length
        ? '<div class="win-wrap"><span class="star l">★</span><div class="headline tape win" style="font-size:min(calc(8.6 * var(--h)),' +
          (64 / (inline ? chars : 2)).toFixed(2) + 'vw)">優勝' + (inline ? "　" + esc(names) : "") + '</div><span class="star r">★</span></div>'
        : '<div class="headline tape">最終結果</div>';
      if (s.winners.length && !inline) {
        status = '<span style="font-size:min(calc(3.2 * var(--h)),' + (90 / names.length).toFixed(2) + 'vw)">' + esc(names) + "</span>";
      }
    }
    el("main").innerHTML = main;
    el("status").innerHTML = status;
  }

  // ---- 部門のカード ----------------------------------------------------

  // 途中順位と最終結果は順位で並べ、順位を出す
  function isRanked(s) { return s.state === STATE.ROUND_RESULT || s.state === STATE.FINISHED; }

  function ordered(s) {
    var teams = s.teams.slice();
    if (isRanked(s)) {
      teams.sort(function (a, b) { return (a.rank - b.rank) || (a.number - b.number); });
    }
    return teams;
  }

  function slot(s, t) {
    if (s.state === STATE.ANSWERING) {
      if (t.answered) return '<div class="slot done">✓ 回答済み</div>';
      return '<div class="slot">' + (t.eliminated ? "（脱落）" : "考え中…") + "</div>";
    }
    var opened = s.state === STATE.OPEN || s.state === STATE.REVEAL;
    if (isRanked(s) && t.damage != null) {
      return '<div class="slot"><span class="note">第' + s.round + "問 " +
        (t.damage > 0 ? "<b>−" + t.damage + "</b>" : (t.error === 0 ? "ぴったり" : "±0")) + "</span></div>";
    }
    if (!opened) return '<div class="slot"></div>';
    var guess = t.answer == null
      ? '<span class="guess">50<small>%</small></span><span class="note">未回答</span>'
      : '<span class="guess">' + t.answer + "<small>%</small></span>";
    // 予想は予想オープンでめくる。正解発表のあいだは描き直してもめくり直さない
    return '<div class="slot' + (s.state === STATE.OPEN ? " flip" : "") + '">' + guess + "</div>";
  }

  // 正解発表の後半に、数字の右に貼る減る数の札（前半のあいだは出さない）
  function chip(s, t) {
    if (s.state !== STATE.REVEAL || !chipsShown || t.damage == null) return "";
    if (t.damage > 0) return '<div class="dmg tape">−' + t.damage + "</div>";
    return '<div class="dmg tape zero">' + (t.error === 0 ? "ぴったり" : "±0") + "</div>";  // ±0 は脱落済みで減らない
  }

  function card(s, t) {
    var cls = ["card"];
    if (s.state === STATE.ANSWERING && t.answered) cls.push("answered");
    // この問題で脱落する部門は、正解発表の数え下げが0に届いたときに灰色にする（tick）。前の問題までに脱落した部門は最初から灰色
    var outNow = t.eliminated && (s.state !== STATE.REVEAL || !(t.damage > 0) || (countStart !== null && countProgress() >= 1));
    if (outNow) cls.push("out");
    var ranked = isRanked(s);
    if (ranked && t.rank === 1) cls.push("top1");
    var start = displayedBalloons(s, t);
    return '<div class="' + cls.join(" ") + '" data-team="' + t.number + '">' +
      '<div class="head"><div class="name">' + esc(t.name) + "</div></div>" +
      // 脱落の札と順位は数字の右に出す（部門名の横に置くと「ステージイベント」が切れる。
      // 下の欄に重ねると文字が隠れる。正解発表では数え下げが0に届いてから灰色にする）
      '<div class="count-row"><div class="count"><span class="n">' + start + "</span><small>個</small></div>" +
      '<div class="side">' + chip(s, t) + (outNow ? '<div class="badge tape">脱落</div>' : "") +
      (ranked ? '<div class="rank">' + t.rank + "位</div>" : "") + "</div></div>" +
      '<div class="meter">' + meter(s, t, start) + "</div>" +
      slot(s, t) +
      "</div>";
  }

  // 横棒。札を貼ったあとは、残る分を赤、減る分を黄色の斜線にして、斜線を数え下げに合わせて縮める
  function meter(s, t, shown) {
    if (s.state !== STATE.REVEAL || !chipsShown || !(t.damage > 0)) return '<i style="width:' + shown + '%"></i>';
    return '<i style="width:' + t.balloons + '%"></i><b style="left:' + t.balloons + "%;width:" + (shown - t.balloons) + '%"></b>';
  }

  function countProgress() {
    var p = Math.min(1, Math.max(0, (performance.now() - countStart) / REVEAL_COUNT_MS));
    return 1 - Math.pow(1 - p, 3);
  }

  // 正解発表のあいだは、発表前の数から今の数へ数え下げる（数え下げを始めるまでは発表前の数のまま）
  function displayedBalloons(s, t) {
    if (s.state !== STATE.REVEAL || !t.damage) return t.balloons;
    if (countStart === null) return t.balloons + t.damage;
    return Math.round(t.balloons + t.damage * (1 - countProgress()));
  }

  function renderGrid(s) {
    var teams = ordered(s);
    if (!teams.length) { el("grid").innerHTML = '<div class="empty">参加する部門がありません</div>'; return; }
    // 2段に分ける（10なら5と5、9なら5と4、7なら4と3）。1段に5枚まで
    var rows = teams.length <= 5 ? [teams] : [teams.slice(0, Math.ceil(teams.length / 2)), teams.slice(Math.ceil(teams.length / 2))];
    el("grid").innerHTML = rows.map(function (row) {
      return '<div class="row">' + row.map(function (t) { return card(s, t); }).join("") + "</div>";
    }).join("");
  }

  // 数字と横棒だけを書き換える（カードを作り直すと札の動きがやり直しになる）
  function tick() {
    var s = current;
    if (s && s.state === STATE.REVEAL && countStart !== null) {
      var changed = false;
      s.teams.forEach(function (t) {
        var node = document.querySelector('.card[data-team="' + t.number + '"]');
        if (!node || !(t.damage > 0)) return;
        var n = displayedBalloons(s, t), num = node.querySelector(".n");
        if (num.textContent === String(n)) return;
        num.textContent = n;
        num.classList.remove("bump");
        void num.offsetWidth;  // 弾む動きを始めからやり直す
        num.classList.add("bump");
        var lost = node.querySelector(".meter b");
        if (lost) lost.style.width = (n - t.balloons) + "%";
        changed = true;
        // この問題で脱落する部門は、0 に届いたところで灰色にして「脱落」の札を貼る
        if (t.eliminated && n === 0 && !node.classList.contains("out")) {
          node.classList.add("out");
          node.querySelector(".side").insertAdjacentHTML("beforeend", '<div class="badge tape new">脱落</div>');
        }
      });
      if (changed) sound.count(countProgress());
    }
    reveal.frame();
    requestAnimationFrame(tick);
  }

  // ---- 音（Scratch の効果音。ブラウザの決まりで、画面を1回クリックするまで鳴らせない） ------------

  var sound = (function () {
    var ctx = null, buffers = {}, lastCount = 0;
    function load(url) {
      fetch(url).then(function (r) { if (!r.ok) throw new Error(); return r.arrayBuffer(); })
        .then(function (data) { return ctx.decodeAudioData(data); })
        .then(function (buf) { buffers[url] = buf; })
        .catch(function () { /* 素材がなければ鳴らさない */ });
    }
    function play(url, rate) {
      if (!ctx || !buffers[url]) return;
      var src = ctx.createBufferSource();
      src.buffer = buffers[url];
      src.playbackRate.value = rate || 1;
      src.connect(ctx.destination);
      src.start();
    }
    function unlock() {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!ctx && Ctx) { ctx = new Ctx(); load(COUNT_SOUND); load(CORRECT_SOUND); }
      if (ctx && ctx.state === "suspended") ctx.resume();
      el("sound").hidden = true;
    }
    el("sound").addEventListener("click", unlock);
    document.addEventListener("pointerdown", unlock);
    return {
      // 進み具合（0〜1）に合わせて音程を上げる（元の Scratch と同じ鳴らし方）
      count: function (progress) {
        var now = performance.now();
        if (now - lastCount < COUNT_GAP_MS) return;
        lastCount = now;
        play(COUNT_SOUND, 1 + progress * 1.2);
      },
      // 正解発表の前半：ゲージが目盛りを1つ進むたびに鳴らす（進むほど音程を上げる）。止まったら正解の音
      gauge: function (progress) {
        var now = performance.now();
        if (now - lastCount < COUNT_GAP_MS) return;
        lastCount = now;
        play(COUNT_SOUND, .8 + progress * .9);
      },
      correct: function () { play(CORRECT_SOUND, 1); },
    };
  })();

  // ---- 正解発表の前半：予想のピンとゲージ ----------------------------------
  // 経過時間から毎コマ画面を決める（frame）。ピンが予想の小さい順に立つ → ゲージが伸び、正解に近づくほど遅くなる →
  // 正解の位置で止まり、ゲージの先の数字が黄色の札になって大きくなる。正解にいちばん近い部門の名札を黄色にする →
  // RV_HOLD_MS たったら薄くし始め、done(RV_FADE_MS) で後半（カードの画面の数え下げ）に渡す

  var reveal = (function () {
    var wrap = el("rv"), pinsEl = el("rv-pins"), gauge = el("rv-gauge");
    var fill = el("rv-fill"), tip = el("rv-tip"), ans = el("rv-ans"), num = el("rv-num"), ansV = ans.querySelector(".v");
    var COLORS = ["var(--red)", "var(--blue)", "var(--yellow)", "var(--ink)"];
    var run = null;  // 流している正解発表 { correct, teams, start, fillMs, stopAt, done, lastNum, stopped }

    // 目盛り（5 ごとに線、10 ごとに数字）は一度だけ作る
    var ticks = "";
    for (var v = 0; v <= 100; v += 5) {
      ticks += '<i class="' + (v % 10 ? "" : "maj") + '" style="left:' + v + '%"></i>' +
        (v % 10 ? "" : '<b data-v="' + v + '" style="left:' + v + '%">' + v + "</b>");
    }
    el("rv-ticks").innerHTML = ticks;
    var tickLabels = Array.prototype.slice.call(document.querySelectorAll("#rv-ticks b"));

    function clamp(x) { return Math.max(0, Math.min(1, x)); }
    function guessOf(t) { return t.answer == null ? 50 : t.answer; }  // 未回答は予想50として数える（battle.UNANSWERED_GUESS）

    // 名札の積み方。名札がほかの部門の棒をまたぐときは、その部門より上の段に置く（棒が名札を突き抜けないように）。
    // 名札を棒から伸ばす向きは、境目で左右の組に分けて組ごとにそろえ、外向き・内向きの両方と全部の境目を試して、
    // 突き抜けが残らず段がいちばん少ないものを選ぶ（予想が近い部門が多いと山の形になる）
    function stack(xs, ws, minX, maxX, gap) {
      var n = xs.length, idx = xs.map(function (x, i) { return i; }).sort(function (a, b) { return xs[a] - xs[b] || a - b; });
      var pad = gap * .7, best = null;
      for (var trial = 0; trial < 2 * (n + 1); trial++) {
        // 境目で左右の組に分け、組ごとに名札を伸ばす向きをそろえる（外向き／内向きの両方を試す）。
        // 画面の端で押し戻される名札だけは向きを変える
        var pivot = trial >> 1, inward = trial & 1, lab = [];
        idx.forEach(function (i, k) {
          var toLeft = (k < pivot) !== !!inward;
          var place = function (dirLeft) {
            var raw = dirLeft ? xs[i] + pad - ws[i] : xs[i] - pad;
            var left = Math.max(minX, Math.min(raw, maxX - ws[i]));
            return { left: left, shift: Math.abs(left - raw) };
          };
          var sp = place(toLeft);
          if (sp.shift > 0) { var other = place(!toLeft); if (other.shift < sp.shift) sp = other; }
          lab[i] = { i: i, x: xs[i], left: sp.left, right: sp.left + ws[i], lane: -1, under: [] };
        });
        // 名札がほかの部門の棒をまたぐなら、その部門より上の段に置く（棒が名札を突き抜けないように）
        lab.forEach(function (p) {
          // 同じ予想（棒がほぼ重なる）の部門どうしは、またぐと数えない（棒が1本に見えるので、どちらが上でもよい）
          lab.forEach(function (q) {
            if (p !== q && Math.abs(q.x - p.x) >= pad && q.x > p.left && q.x < p.right) p.under.push(q);
          });
        });
        // またぐ関係をたどる順（下に来る部門が先）に並べる。輪になったら（互いにまたぐ）、そこは突き抜けを1つ許して数える
        var order = [], mark = [], bad = 0;
        var visit = function (p) {
          if (mark[p.i] === 2) return;
          if (mark[p.i] === 1) { bad += 1; return; }
          mark[p.i] = 1;
          p.under.forEach(visit);
          mark[p.i] = 2;
          order.push(p);
        };
        idx.forEach(function (i) { visit(lab[i]); });
        // 下の部門より上で、同じ段の名札と重ならないいちばん低い段に置く
        var top = 0;
        order.forEach(function (p) {
          var lane = 0;
          p.under.forEach(function (q) { if (q.lane >= 0) lane = Math.max(lane, q.lane + 1); });
          var clash = function (l) {
            return order.some(function (q) { return q.lane === l && q.left < p.right + gap && q.right > p.left - gap; });
          };
          while (clash(lane)) lane++;
          p.lane = lane;
          top = Math.max(top, lane);
        });
        var score = bad * 100 + top;
        if (!best || score < best.score) best = { lab: lab, lanes: top + 1, bad: bad, score: score };
      }
      return best;
    }

    // ピンの名札を、問題文とゲージのあいだに収まるよう積む。段が収まらなければ名札を縮める（最小 0.55 倍）
    function layout() {
      if (!run || !run.teams.length) return;
      var unit = Math.min(innerHeight / 100, innerWidth * .00625), gap = unit * 1.2, base = unit * 4;
      var H = gauge.getBoundingClientRect().top - el("rv-q").getBoundingClientRect().bottom - unit * 2;
      pinsEl.style.height = Math.max(0, H) + "px";
      var W = pinsEl.clientWidth, minX = -innerWidth * .05, maxX = W + innerWidth * .05;
      var xs = run.teams.map(function (t) { return t.guess / 100 * W; });
      var scale = 1, res, labH;
      // 段が収まらないか、突き抜けが残るときは名札を縮めて積み直す
      for (var tries = 0; tries < 8; tries++) {
        pinsEl.style.setProperty("--ps", scale);
        var ws = run.teams.map(function (t, i) { return pinsEl.children[i].querySelector(".lab").offsetWidth; });
        labH = pinsEl.children[0].querySelector(".lab").offsetHeight;
        res = stack(xs, ws, minX, maxX, gap);
        // 段の間隔（unit）と土台（base）は縮まないので、それを除いた分の比で縮める
        var fixed = base + (res.lanes - 1) * unit, need = fixed + res.lanes * labH;
        if ((need <= H && !res.bad) || scale <= .55 || tries === 7) break;
        scale = Math.max(.55, scale * (need > H ? Math.max(0, H - fixed) / (need - fixed) * .98 : .85));
      }
      var step = Math.min(labH + unit * 1.2, (H - base - labH) / Math.max(1, res.lanes - 1));
      res.lab.forEach(function (p) {
        var node = pinsEl.children[p.i], lift = base + p.lane * step;
        node.querySelector(".lab").style.left = (p.left - p.x) + "px";
        node.querySelector(".lab").style.bottom = lift + "px";
        node.querySelector(".stem").style.height = lift + "px";
      });
    }

    // ゲージの値（0〜正解）。前半は速く、正解に近づくほど遅くなる
    function fillAt(t) {
      var p = clamp((t - RV_FILL_AT_MS) / run.fillMs);
      return run.correct * (1 - Math.pow(1 - p, 2.2));
    }

    function draw(t) {
      var stopped = t >= run.stopAt;
      run.teams.forEach(function (tm, i) {
        var node = pinsEl.children[i], p = clamp((t - RV_PIN_AT_MS - tm.order * RV_PIN_GAP_MS) / RV_PIN_MS);
        node.style.visibility = p > 0 ? "visible" : "hidden";
        var lab = node.querySelector(".lab");
        lab.style.transform = "translateY(" + (-(1 - p) * (1 - p) * 6) + "vh)";
        lab.style.opacity = clamp(p * 2);
        node.querySelector(".stem").style.transform = "scaleY(" + p + ")";
        node.querySelector(".dot").style.transform = "scale(" + clamp(p * 1.5) + ")";
        node.classList.toggle("near", stopped && tm.near && t >= run.stopAt + 300);
      });
      var f = stopped ? run.correct : fillAt(t), filling = t >= RV_FILL_AT_MS;
      fill.style.width = f + "%";
      tip.style.left = f + "%";
      tip.style.opacity = filling ? 1 : 0;
      ans.style.left = f + "%";
      ans.style.opacity = filling ? 1 : 0;
      var shown = stopped ? run.correct : Math.floor(f + 1e-6);
      num.textContent = shown;
      ans.classList.toggle("done", stopped);
      // 止まったら 0.45 秒で 2.7 倍まで弾んで大きくなる
      var ps = clamp((t - run.stopAt) / 450);
      var sc = stopped ? 1 + 1.7 * (ps < .6 ? ps / .6 * 1.15 : 1.15 - (ps - .6) / .4 * .15) : 1;
      ans.style.transform = "scale(" + sc + ") rotate(" + (stopped ? -3 * ps : 0) + "deg)";
      // 札が画面の外にはみ出さないよう、端では札だけを内側へずらす（三角はゲージの先に残す）
      ansV.style.marginLeft = "0px";
      var r = ansV.getBoundingClientRect(), edge = innerWidth * .015, shift = 0;
      if (r.left < edge) shift = (edge - r.left) / sc;
      else if (r.right > innerWidth - edge) shift = (innerWidth - edge - r.right) / sc;
      ansV.style.marginLeft = shift + "px";
      // ゲージの先に近い目盛りの数字は、札に隠れるので消す
      tickLabels.forEach(function (b) {
        b.style.opacity = filling && Math.abs(+b.dataset.v - f) < (stopped ? 9 : 4) ? 0 : 1;
      });
      if (filling && !stopped && shown !== run.lastNum) sound.gauge(f / 100);
      if (stopped && !run.stopped) sound.correct();
      run.lastNum = shown;
      run.stopped = stopped;
    }

    // 後半へ移る。重ねた画面を薄くしながら、正解の札をカードの画面の上の正解の札の位置へ飛ばす
    var leaveTimer = null, leaveTimer2 = null;
    function leave() {
      clearTimeout(leaveTimer);
      clearTimeout(leaveTimer2);
      var target = document.querySelector("#main .correct b");
      var from = ansV.getBoundingClientRect();
      wrap.classList.add("leaving");
      if (target && from.width) {
        target.parentNode.style.animation = "none";  // 札が飛んでくるので、カードの画面の正解は弾ませない（弾む途中だと位置を測り違える）
        var fly = document.createElement("div");
        fly.className = "correct rv-fly";
        fly.innerHTML = target.outerHTML;
        var to = target.getBoundingClientRect();
        fly.style.left = to.left + "px";
        fly.style.top = to.top + "px";
        document.body.appendChild(fly);
        // 札は少し傾いているので、外接の四角どうしがそろうよう置き直す（着地して入れ替わるときに跳ねないように）
        var landed = fly.querySelector("b").getBoundingClientRect();  // 傾いているのは中の札
        fly.style.left = (2 * to.left - landed.left) + "px";
        fly.style.top = (2 * to.top - landed.top) + "px";
        var k = from.width / to.width;
        fly.style.transform = "translate(" + (from.left - to.left) + "px," + (from.top - to.top) + "px) scale(" + k + ")";
        target.style.visibility = "hidden";
        void fly.offsetWidth;  // 始めの位置を確定させてから動かす
        fly.style.transform = "none";
        leaveTimer = setTimeout(function () {
          target.style.visibility = "";
          fly.remove();
        }, RV_FADE_MS);
      }
      leaveTimer2 = setTimeout(function () { if (!run) wrap.classList.remove("on"); }, RV_FADE_MS);
    }

    return {
      // 正解発表を頭から流す。終わったら done(薄くする時間) を呼ぶ
      play: function (s, done) {
        var teams = s.teams.map(function (t, i) {
          return { name: t.name, guess: guessOf(t), na: t.answer == null, out: t.eliminated && !(t.damage > 0), c: COLORS[i % COLORS.length] };
        });
        var errs = teams.filter(function (t) { return !t.out; }).map(function (t) { return Math.abs(t.guess - s.correct); });
        var best = errs.length ? Math.min.apply(null, errs) : -1;
        teams.forEach(function (t) { t.near = !t.out && Math.abs(t.guess - s.correct) === best; });
        teams.map(function (t, i) { return i; }).sort(function (a, b) { return teams[a].guess - teams[b].guess || a - b; })
          .forEach(function (i, k) { teams[i].order = k; });
        var fillMs = RV_FILL_BASE_MS + RV_FILL_PER_MS * s.correct;
        run = { correct: s.correct, teams: teams, start: performance.now(), fillMs: fillMs, stopAt: RV_FILL_AT_MS + fillMs,
          done: done, lastNum: null, stopped: false };
        el("rv-q").textContent = s.question.text;
        pinsEl.innerHTML = teams.map(function (t) {
          return '<div class="rv-pin' + (t.out ? " out" : "") + '" style="--c:' + t.c + ";left:" + t.guess + '%">' +
            '<i class="stem"></i><i class="dot"></i><div class="lab"><span>' + esc(t.name) + '</span><b' + (t.na ? ' class="na"' : "") + ">" +
            t.guess + "</b></div></div>";
        }).join("");
        wrap.classList.remove("leaving");
        layout();
        draw(0);
        wrap.classList.add("on");
      },
      // tick から毎コマ呼ぶ
      frame: function () {
        if (!run) return;
        var t = performance.now() - run.start;
        draw(t);
        if (t >= run.stopAt + RV_HOLD_MS) {
          var done = run.done;
          run = null;
          done(RV_FADE_MS);  // 下の画面を、上に正解の出たカードの画面にしておく
          leave();
        }
      },
      // 途中でやめる（送り直し・モードの切り替え）。薄くして消すだけ
      stop: function () {
        run = null;
        clearTimeout(leaveTimer);
        clearTimeout(leaveTimer2);
        wrap.classList.remove("on");  // leaving は残す（外すと、薄くした地と部品が一瞬戻ってちらつく）。次の play で外す
        document.querySelectorAll(".rv-fly").forEach(function (fly) { fly.remove(); });
        var hidden = document.querySelector("#main .correct b");
        if (hidden) hidden.style.visibility = "";
      },
      relayout: layout,
    };
  })();
  window.addEventListener("resize", function () { reveal.relayout(); });

  // 正解発表の後半：上に正解を出し、重ねた画面が消えるのを待って（wait ミリ秒）札を貼り、数え下げを始める
  function startCount(wait) {
    var s = current;
    revealPhase = false;
    if (!s || s.state !== STATE.REVEAL) return;
    renderTop(s);
    renderGrid(s);
    clearTimeout(chipTimer);
    chipTimer = setTimeout(function () {
      if (!current || current.state !== STATE.REVEAL || current.round !== s.round) return;
      chipsShown = true;
      countStart = performance.now() + CHIP_LEAD_MS;
      renderGrid(current);
    }, wait || 0);
  }

  function render(s) {
    if (!s || s.mode !== "battle") {
      revealPhase = false; reveal.stop(); openRound = null;
      current = null; lastKey = null; render.sig = null;
    }
    if (!s) { el("grid").innerHTML = ""; el("main").innerHTML = '<div class="question small">まもなく始まります</div>'; return; }
    if (s.mode !== "battle") {
      el("grid").innerHTML = '<div class="empty">いまは部門対抗モードではありません</div>';
      el("main").innerHTML = ""; el("status").textContent = ""; return;
    }
    var key = s.state + ":" + s.round;
    var answered = s.teams.map(function (t) { return t.answered ? 1 : 0; }).join("");
    // 回答受付中は回答済みの印だけが変わるので、変わったときに描き直す
    var sig = key + "|" + answered + "|" + s.teams.length + "|" + s.teams.map(function (t) { return t.number; }).join(",");
    var fresh = key !== lastKey;
    current = s;
    lastKey = key;
    if (s.state === STATE.OPEN) openRound = s.round;
    else if (s.state === STATE.IDLE) openRound = null;
    if (fresh) {
      countStart = null; chipsShown = false; clearTimeout(chipTimer);
      // 前半か、後半へ移るフェードの途中で進んだ（送り直し）。重ねた画面と飛んでいる札を片付ける
      revealPhase = false; reveal.stop();
      if (s.state === STATE.REVEAL) {
        if (openRound === s.round && s.question && s.correct != null) {
          // 予想オープンから続けて見ている。大画面は発表前の数のまま、上にピンとゲージを重ねる。終わったら startCount
          revealPhase = true;
          openRound = null;  // 1回流したら使い切り（同じ問題の正解発表に後から入り直しても、頭からは流さない）
          reveal.play(s, startCount);
        } else {
          startCount(0);  // 正解発表の途中で開いた（開き直した）ときは、頭から流さずにすぐ後半へ
          render.sig = sig;
          return;
        }
      }
    }
    if (fresh || sig !== render.sig) {
      renderTop(s);
      renderGrid(s);
      render.sig = sig;
    }
  }

  poll();
  setInterval(poll, POLL_MS);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
